<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savannah Kings · R2</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/preloader.css?v=1">
<link rel="stylesheet" href="css/savannah-r2.css?v=12">
<link rel="stylesheet" href="css/savannah-r2-layouts.css?v=1">
<link rel="stylesheet" href="css/ui-bar-v3.css?v=6">
<link rel="stylesheet" href="css/dev-tools.css?v=6">
</head>
<body>

  <div class="preloader" id="preloader">
    <div class="preloader__logo" id="preloaderLogo"><img src="img/savannah-r2/img/logo.webp" alt="" onerror="this.remove()"></div>
    <div class="preloader__bar"><div class="preloader__fill" id="preloaderFill"></div></div>
    <div class="preloader__pct" id="preloaderPct">0%</div>
  </div>

  <a class="to-catalog-btn" href="games.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    В каталог
  </a>

  <div class="screen" id="screen" data-mode="base" data-layout="1">
    <!-- Day and night backgrounds both live in the DOM and cross-fade
         (GDD §3.2: the switch to night is the free-spins signal). -->
    <img class="bg bg--base" id="bgBase" alt="">
    <img class="bg bg--bonus" id="bgBonus" alt="">
    <canvas class="fx fx--back" id="fxBack"></canvas>

    <!-- Everything else sits on one design-size stage, scaled to fit. -->
    <div class="stage" id="stage">

      <!-- V3 "Royal Court": strictly symmetric. Jackpot crown above the
           frame crest, Buy and Win/Free-spins medallions mirrored either
           side of the reels, a floating pill with the spin breaking out. -->
      <img class="logo" src="img/savannah-r2/img/logo.webp" alt="Savannah Kings">

      <div class="sys">
        <button class="ibtn ibtn--ghost" type="button" aria-label="Sound"><svg viewBox="0 0 24 24"><path class="snd" d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z"/><path class="wav" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M15 9l6 6M21 9l-6 6"/></svg></button>
        <button class="ibtn ibtn--ghost" type="button" aria-label="Paytable"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg></button>
        <div class="menu" id="menu">
          <button class="ibtn ibtn--ghost" id="menuBtn" type="button" aria-label="Menu">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="menu__fly">
            <a class="menu__item" href="games.html"><svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h4.5v-5h3v5H18V9.5"/></svg><span>LOBBY</span></a>
          </div>
        </div>
      </div>

      <!-- Prize crown: GRAND is the keystone over the crest, the three lower
           tiers form the step beneath it (MINOR · MAJOR · MINI). -->
      <!-- Golden Savannah: plaques with crowns are twice as tall, so the prize
           ladder runs in one row above the frame, MINI -> GRAND. -->
      <div class="crown crown--ladder">
        <div class="jp jp--mini"><img src="img/savannah-r2/img/jp_mini.webp" alt="Mini"><span data-jp-value="mini"></span></div>
        <div class="jp jp--minor"><img src="img/savannah-r2/img/jp_minor.webp" alt="Minor"><span data-jp-value="minor"></span></div>
        <div class="jp jp--major"><img src="img/savannah-r2/img/jp_major.webp" alt="Major"><span data-jp-value="major"></span></div>
        <div class="crown__top"><div class="jp jp--grand"><img src="img/savannah-r2/img/jp_grand.webp" alt="Grand"><span data-jp-value="grand"></span></div></div>
      </div>

      <div class="reel" id="reel">
        <div class="reel__bg"></div>
        <div class="reel__grid" id="reelGrid"></div>
        <img class="reel__frame" src="img/savannah-r2/img/reel_frame.webp" alt="">
        <div class="reel-win-plate" id="reelWinPlate"></div>
        <div class="reel-win" id="reelWinAmount"></div>
      </div>

      <!-- Left medallion: Buy Bonus. -->
      <button class="medal medal--buy buy-btn" type="button" data-buy-open aria-label="Buy bonus">
        <span class="medal__disc">
          <span class="medal__core"></span>
          <img class="medal__hub" src="img/savannah-r2/img/wheel_hub.webp" alt="">
          <img class="medal__rim" src="img/savannah-r2/img/wheel_rim.webp" alt="">
        </span>
        <span class="medal__caption">BUY BONUS</span>
        <span class="medal__chip"><span id="buyPrice"></span></span>
      </button>

      <!-- Right medallion, its mirror: last win in the base game, spins left
           and bonus win during free spins. -->
      <div class="medal medal--status">
        <span class="medal__disc">
          <span class="medal__core"></span>
          <img class="medal__rim" src="img/savannah-r2/img/wheel_rim.webp" alt="">
        </span>
        <div class="readout readout--win" id="winReadout">
          <span class="readout__value" id="winValue"></span>
          <span class="readout__label">WIN</span>
        </div>
        <div class="fs-panel" id="fsPanel">
          <div class="fs-panel__cell">
            <span class="fs-panel__value" id="fsLeft">10</span>
            <span class="fs-panel__label">FREE SPINS</span>
          </div>
          <div class="fs-panel__sep"></div>
          <div class="fs-panel__cell">
            <span class="fs-panel__label">BONUS WIN</span>
            <span class="fs-panel__value" id="fsWin">0.00</span>
          </div>
        </div>
      </div>

      <!-- Floating pill: balance | turbo SPIN auto | bet. -->
      <div class="bar" id="bar">
        <div class="bar__left">
          <div class="readout readout--balance">
            <span class="readout__label">BALANCE</span>
            <span class="readout__value"><span>0.00</span> <small>FUN</small></span>
          </div>
        </div>

        <div class="bar__center">
          <button class="ibtn" id="turboBtn" type="button" aria-label="Turbo"><svg viewBox="0 0 24 24"><path d="M13.5 3 6 13.5h5L10 21l8-10.5h-5L13.5 3Z" class="fill"/></svg></button>
          <button class="spin" type="button" aria-label="Spin">
            <span class="spin__ring"></span>
            <svg class="spin__icon" viewBox="0 0 48 48"><path d="M10 21a15 15 0 0 1 25-7.5"/><path d="M35.5 7v7h-7"/><path d="M38 27a15 15 0 0 1-25 7.5"/><path d="M12.5 41v-7h7"/></svg>
            <svg class="spin__stop" viewBox="0 0 48 48"><rect x="15" y="15" width="18" height="18" rx="3"/></svg>
            <span class="spin__count" id="spinCount"></span>
          </button>
          <div class="auto-wrap">
            <button class="ibtn" id="autoBtn" type="button" aria-label="Autoplay"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/><path d="M10 9l5 3-5 3Z" class="fill"/></svg></button>
            <div class="auto-menu" id="autoMenu" hidden>
              <span class="auto-menu__title">AUTOPLAY</span>
              <button data-auto="10" type="button">10</button>
              <button data-auto="25" type="button">25</button>
              <button data-auto="50" type="button">50</button>
              <button data-auto="100" type="button">100</button>
              <button data-auto="inf" type="button">∞</button>
            </div>
          </div>
        </div>

        <div class="bar__right">
          <div class="bet">
            <button class="ibtn ibtn--sm" id="betMinusOld" type="button" aria-label="Lower bet"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
            <div class="readout readout--bet">
              <span class="readout__label">BET</span>
              <span class="readout__value">0.00</span>
            </div>
            <button class="ibtn ibtn--sm" id="betPlusOld" type="button" aria-label="Raise bet"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <canvas class="fx fx--front" id="fxFront"></canvas>
    <!-- Spine win lines (scripts/savannah_r2_winlines.py): over the reels, under the dim and the popups. -->
    <canvas class="spine-canvas" id="spineCanvas"></canvas>
    <div class="screen-dim" id="screenDim"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Jackpot Wheel backdrop: dims the WHOLE screen (the stage letterboxes on
         other aspect ratios) and grows savanna bushes in the corners. -->
    <div class="wheel-scene" id="wheelScene" aria-hidden="true">
      <img class="wheel-scene__bush wheel-scene__bush--bl" src="img/savannah-r2/img/bush_bl.webp?v=1" alt="">
      <img class="wheel-scene__bush wheel-scene__bush--br" src="img/savannah-r2/img/bush_br.webp?v=1" alt="">
      <img class="wheel-scene__bush wheel-scene__bush--tl" src="img/savannah-r2/img/bush_tl.webp?v=1" alt="">
      <img class="wheel-scene__bush wheel-scene__bush--tr" src="img/savannah-r2/img/bush_tr.webp?v=1" alt="">
      <img class="wheel-scene__bush wheel-scene__bush--gl" src="img/savannah-r2/img/bush_grass.webp?v=1" alt="">
      <img class="wheel-scene__bush wheel-scene__bush--gr" src="img/savannah-r2/img/bush_grass_r.webp?v=1" alt="">
    </div>

    <!-- Popups, the wheel and the buy window are scaled with the stage too. -->
    <div class="overlays stage" id="overlays">

      <div class="wheel-overlay" id="wheelOverlay" hidden>
        <img class="wheel-overlay__title" src="img/savannah-r2/img/title_jackpot_wheel.webp?v=2" alt="Jackpot Wheel">
        <div class="jackpots jackpots--wheel">
          <div class="jp jp--grand"><img src="img/savannah-r2/img/jp_grand.webp" alt="Grand"><span data-jp-value="grand"></span></div>
          <div class="jp jp--major"><img src="img/savannah-r2/img/jp_major.webp" alt="Major"><span data-jp-value="major"></span></div>
          <div class="jp jp--minor"><img src="img/savannah-r2/img/jp_minor.webp" alt="Minor"><span data-jp-value="minor"></span></div>
          <div class="jp jp--mini"><img src="img/savannah-r2/img/jp_mini.webp" alt="Mini"><span data-jp-value="mini"></span></div>
        </div>
        <div class="wheel">
          <div class="wheel__glow"></div>
          <div class="wheel__disc" id="wheelDisc"></div>
          <img class="wheel__rim" src="img/savannah-r2/img/wheel_rim_wood.webp" alt="">
          <div class="wheel__lights" id="wheelLights"></div>
          <img class="wheel__hub" src="img/savannah-r2/img/wheel_hub.webp" alt="">
          <img class="wheel__pointer" id="wheelPointer" src="img/savannah-r2/img/wheel_pointer.webp" alt="">
          <!-- R2: the spin button is the hub itself, it pulses until pressed -->
          <button class="wheel__btn" id="wheelSpinBtn" type="button" disabled><span>SPIN</span></button>
        </div>
        <div class="wheel-award" id="wheelAward" hidden>
          <div class="wheel-award__rays"></div>
          <div class="wheel-award__tier"></div>
          <div class="wheel-award__panel"><img src="img/savannah-r2/img/panel.webp" alt=""><div class="wheel-award__value"></div></div>
        </div>
      </div>

      <div class="buy-overlay" id="buyOverlay" hidden>
        <div class="buy">
          <img class="buy__title" src="img/savannah-r2/img/title_buybonus.webp?v=7" alt="Buy Bonus">
          <button class="buy__close" type="button" data-buy="close" aria-label="Close">×</button>
          <div class="buy__cards"></div>
          <div class="buy__confirm">
            <p class="buy__q"></p>
            <div class="buy__actions">
              <button class="gbtn gbtn--no" type="button" data-buy="no">CANCEL</button>
              <button class="gbtn" type="button" data-buy="yes">BUY</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Spine popups (scripts/savannah_r2_popups.py): over the overlays and the wheel. -->
    <canvas class="spine-pop" id="popupCanvas"></canvas>

    <div class="paytable" id="paytable" hidden>
      <div class="paytable__panel">
        <button class="paytable__close" id="paytableClose" type="button" aria-label="Close">×</button>
        <h2>Paytable &amp; Rules</h2>
        <div class="paytable__body" id="paytableBody"></div>
      </div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/audio-mute.js?v=1"></script>
  <script src="js/telegram.js?v=3"></script>
  <script src="js/preloader.js?v=1"></script>
  <script src="js/config.js?v=2"></script>
  <!-- R2 is a client review build: the DEV + ♪ pult stays on everywhere (also on Pages); ?dev=0 hides it. -->
  <script>if (new URLSearchParams(location.search).get('dev') !== '0') window.SLOT_CONFIG.showDevPanels = true;</script>
  <script src="js/api.js?v=2"></script>
  <!-- Нижний бар V3 — контракт data-action / id / классов не менять. -->
  <div class="v3-bar" id="v3Bar">
    <div class="v3-row">
      <div class="v3-group">
        <div class="v3-menu">
          <div class="v3-menu__flyout" id="v3Flyout">
            <button class="ui-icon-btn v3-btn" data-action="home" type="button" aria-label="В каталог">
              <svg viewBox="0 0 24 24"><path d="M3 11.4 12 4l9 7.4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.6 10v9.2h4.2v-5.6h4.4v5.6h4.2V10" fill="currentColor" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg>
            </button>
            <button class="ui-icon-btn v3-btn v3-btn--sound" id="soundBtn" data-action="sound" type="button" aria-label="Звук">
              <svg viewBox="0 0 24 24"><path class="v3-spk" d="M4 9.2v5.6h3.6L13 19V5L7.6 9.2H4Z" fill="currentColor"/><path class="v3-wave v3-wave--1" d="M16.2 9a4.6 4.6 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="v3-wave v3-wave--2" d="M18.9 6.6a8 8 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="v3-slash" d="M5 19 19 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </button>
            <button class="ui-icon-btn v3-btn v3-btn--buy" data-buy-open type="button" aria-label="Buy Bonus">
              <svg viewBox="0 0 24 24"><rect x="4" y="9.5" width="16" height="10.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3 7.5h18v2.6H3zM12 7.5V20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 7.3c-1.2-2.8-4.6-3.7-5.2-1.6-.5 1.7 2.4 1.9 5.2 1.6Zm0 0c1.2-2.8 4.6-3.7 5.2-1.6.5 1.7-2.4 1.9-5.2 1.6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            </button>
            <button class="ui-icon-btn v3-btn" id="infoBtn" data-action="info" type="button" aria-label="Информация">
              <svg viewBox="0 0 24 24"><rect x="10.6" y="10" width="2.8" height="9" rx="1.4" fill="currentColor"/><circle cx="12" cy="6.4" r="1.7" fill="currentColor"/></svg>
            </button>
          </div>
          <button class="ui-icon-btn v3-btn v3-btn--menu" id="v3MenuBtn" type="button" aria-label="Меню" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M4 7.5h16M4 12h16M4 16.5h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <span class="v3-btn__dot" aria-hidden="true"></span>
          </button>
        </div>
        <button class="ui-icon-btn v3-btn v3-btn--auto" id="v3AutoBtn" type="button" aria-label="Автоигра" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.1" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.6 15.4 12 7.6l3.4 7.8M9.8 13.2h4.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="ui-spin-btn v3-spin" id="spinBtn" data-action="spin" type="button" aria-label="Спин">
        <span class="v3-spin__ring" aria-hidden="true"></span>
        <svg class="v3-spin__icon" viewBox="0 0 48 48">
          <path d="M9 20.5A15.2 15.2 0 0 1 34.4 14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M34.6 7.4V14h-6.7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M39 27.5A15.2 15.2 0 0 1 13.6 34" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M13.4 40.6V34h6.7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="v3-spin__count" id="v3SpinCount" hidden></span>
      </button>
      <div class="v3-group">
        <button class="ui-icon-btn v3-btn v3-btn--turbo" id="v3TurboBtn" type="button" aria-label="Турбо" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M13.4 2.5 5.2 13.4h5.1l-1.1 8.1 8.3-11.1h-5.2l1.1-7.9Z" fill="currentColor"/></svg>
        </button>
        <button class="ui-icon-btn v3-btn v3-btn--bet" id="v3BetBtn" type="button" aria-label="Ставка" aria-expanded="false">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="7.4" rx="7.6" ry="2.9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.4 7.4v3.1c0 1.6 3.4 2.9 7.6 2.9s7.6-1.3 7.6-2.9V7.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.4 11.9V15c0 1.6 3.4 2.9 7.6 2.9s7.6-1.3 7.6-2.9v-3.1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
      </div>
    </div>
    <div class="v3-tip v3-tip--bet" id="v3BetTip" hidden>
      <button class="ui-icon-btn v3-tip__step" id="betMinus" data-action="bet-minus" type="button" aria-label="Уменьшить ставку">
        <svg viewBox="0 0 24 24"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <div class="v3-tip__field">
        <span class="v3-tip__label">BET</span>
        <span class="v3-tip__amount"><span id="v3BetMirror">0</span> <span class="ui-bet-field__currency">FUN</span></span>
      </div>
      <button class="ui-icon-btn v3-tip__step" id="betPlus" data-action="bet-plus" type="button" aria-label="Увеличить ставку">
        <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="v3-chips" id="v3AutoTip" hidden>
      <button class="v3-chip" data-spins="10" type="button">10</button>
      <button class="v3-chip" data-spins="25" type="button">25</button>
      <button class="v3-chip" data-spins="50" type="button">50</button>
      <button class="v3-chip" data-spins="100" type="button">100</button>
    </div>
    <div class="v3-readout">
      <div class="v3-readout__col" id="balanceReadout">
        <span class="v3-readout__label">BALANCE</span>
        <span class="v3-readout__value"><span id="balanceValue">1,000,000</span> <span class="ui-balance__currency" id="currency">FUN</span></span>
      </div>
      <div class="v3-readout__col v3-readout__col--right">
        <span class="v3-readout__label">BET</span>
        <span class="v3-readout__value"><span id="betValue">10,000</span> <span class="v3-readout__cur">FUN</span></span>
      </div>
    </div>
  </div>

  <!-- Пульт DEV + ♪ (js/dev-tools.js), в R2 виден всегда (кроме ?dev=0); адаптер js/savannah-r2/dev.js. -->
  <script src="js/dev-tools.js?v=6"></script>

  <script>
    // V3 bar -> the game's own (hidden) controls: turbo and autoplay keep working.
    // Buy Bonus lives in the menu: opening the buy window folds the menu.
    document.querySelector('.v3-btn--buy').addEventListener('click', () => {
      const m = document.querySelector('.v3-menu'), b = document.getElementById('v3MenuBtn');
      m.classList.remove('is-open'); b.classList.remove('is-open'); b.setAttribute('aria-expanded', 'false');
    });
    document.getElementById('v3TurboBtn').addEventListener('click', () => document.getElementById('turboBtn').click());
    document.querySelectorAll('#v3AutoTip .v3-chip').forEach((c) => c.addEventListener('click', () => {
      const b = document.querySelector(`#autoMenu [data-auto="${c.dataset.spins}"]`); if (b) b.click();
    }));
  </script>
