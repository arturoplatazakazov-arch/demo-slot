<!doctype html>
<!-- Secret Room: комнаты проектов (Illuminator, Spin Factory, Uniqorn,
     Cre8Pics — раскладка игр в games-catalog.js), спрятанные из публичных
     каталогов games.html и tg.html. Одно поле пароля, пароль решает, какая
     комната откроется (ROOMS ниже); посторонний не видит, сколько их всего.
     Секции комнаты лежат в <template> и попадают в DOM только после её
     пароля. Пароль сверяется по SHA-256 прямо в браузере: это ширма от
     случайных зрителей, а не защита — сами игры по-прежнему отдаёт GET /catalog. Открыто с ?from=tg (карточка в
     tg.html) или внутри Telegram — режим портфолио: без кнопок «Админка»,
     «назад» ведёт в tg.html. -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Room</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/games.css?v=7">
</head>
<body>

  <div class="lobby">
    <a class="lobby__back" id="backLink" href="games.html">← В каталог</a>
    <div class="lobby__header">
      <h1 class="lobby__title">Secret Room</h1>
      <p class="lobby__subtitle" id="roomSubtitle">Вход в комнату проекта по паролю</p>
    </div>

    <form class="secret-gate" id="secretGate" autocomplete="off">
      <svg class="secret-gate__lock" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="4.5" y="10" width="15" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor"/></svg>
      <input class="secret-gate__input" id="secretPassword" type="password"
             placeholder="Пароль" aria-label="Пароль" autocapitalize="characters" autofocus>
      <button class="game-card__play" type="submit">Войти</button>
      <p class="secret-gate__error" id="secretError" role="alert"></p>
    </form>

    <div id="rooms"></div>
    <button class="secret-more" id="secretMore" type="button" hidden>Ввести другой пароль</button>

    <template id="room-illuminator">
      <section class="catalog-section" id="illuminatorSection" hidden>
        <h2 class="catalog-section__title">Illuminator</h2>
        <ul class="game-grid" id="illuminatorGrid"></ul>
        <div class="catalog-subsection" id="njsSubsection" hidden>
          <h3 class="catalog-subsection__title">Neon Joker Spins · 5 версий арта</h3>
          <ul class="game-grid" id="njsGrid"></ul>
        </div>
        <div class="catalog-subsection" id="olympusSection" hidden>
          <h3 class="catalog-subsection__title">Olympus Thunder — варианты</h3>
          <ul class="game-grid" id="olympusGrid"></ul>
        </div>
      </section>
    </template>
    <template id="room-spin-factory">
      <section class="catalog-section" id="spinFactorySection" hidden>
        <h2 class="catalog-section__title">Spin Factory</h2>
        <ul class="game-grid" id="spinFactoryGrid"></ul>
      </section>
    </template>
    <template id="room-uniqorn">
      <section class="catalog-section" id="uniqornSection" hidden>
        <h2 class="catalog-section__title">Uniqorn</h2>
        <ul class="game-grid" id="uniqornGrid"></ul>
      </section>
    </template>
    <template id="room-cre8">
      <section class="catalog-section" id="cre8Section" hidden>
        <h2 class="catalog-section__title">Cre8Pics</h2>
        <ul class="game-grid" id="cre8Grid"></ul>
      </section>
    </template>
  </div>

  <script>
    window.CATALOG_SECRET_ROOM = true;
    if (new URLSearchParams(location.search).get('from') === 'tg') window.CATALOG_PORTFOLIO = true;
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/telegram.js?v=2"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script src="js/games-catalog.js?v=15"></script>
  <script>
    (async function () {
      // SHA-256 пароля каждой комнаты (сами пароли в репо не хранятся;
      // вводятся без учёта регистра). sha: null — комната пока закрыта всем.
      const ROOMS = [
        { id: 'illuminator', sha: 'e6722426de7e8d2d79da8c63107bba472a0f2495287fad8f2db0dd7d420ae2bf' },
        { id: 'spin-factory', sha: 'ffea793b9d2b3d782a4d2a3c02bd2dde87f89067429b333c184b5826e7ddd792' },
        { id: 'uniqorn', sha: '708b3fc1ac41f54a4e794a2d8154aa935fbbe70ae32d7d3ed285b5b214859516' },
        { id: 'cre8', sha: '56516915c4cc68bfe3654e3c29d7260761b4576801e49eef445d750f415158d3' },
      ];
      const UNLOCK_KEY = 'secretRoom.rooms';

      if (window.IS_TELEGRAM) window.CATALOG_PORTFOLIO = true;
      if (window.CATALOG_PORTFOLIO) document.getElementById('backLink').href = 'tg.html';

      const gate = document.getElementById('secretGate');
      const input = document.getElementById('secretPassword');
      const error = document.getElementById('secretError');
      const more = document.getElementById('secretMore');
      const roomsEl = document.getElementById('rooms');

      async function sha256(text) {
        const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(bytes), (b) => b.toString(16).padStart(2, '0')).join('');
      }

      // Открытые комнаты храним хэшами паролей: смена пароля в ROOMS сама
      // закрывает комнату у тех, кто входил по старому.
      function loadUnlocked() {
        try { return JSON.parse(sessionStorage.getItem(UNLOCK_KEY)) || []; } catch { return []; }
      }
      function saveUnlocked(hashes) {
        try { sessionStorage.setItem(UNLOCK_KEY, JSON.stringify(hashes)); } catch { /* storage off */ }
      }

      // Перестраиваем все открытые комнаты с нуля (renderCatalog дописывает
      // карточки в гриды, повторный вызов поверх старых дал бы дубли).
      function showRooms(hashes) {
        const open = ROOMS.filter((r) => r.sha && hashes.includes(r.sha));
        if (!open.length) return false;
        roomsEl.replaceChildren(...open.map((r) => document.getElementById(`room-${r.id}`).content.cloneNode(true)));
        gate.hidden = true;
        more.hidden = false;
        renderCatalog();
        return true;
      }

      // Прямая ссылка на комнату: secret-room.html#key=<пароль> (в боте —
      // startapp=room_<пароль>, см. tg.html). Фрагмент не уходит на сервер;
      // после входа он стирается из адресной строки.
      async function tryKey(key) {
        const hash = await sha256(key.trim().toUpperCase());
        if (!ROOMS.some((r) => r.sha === hash)) return false;
        const hashes = [...new Set([...loadUnlocked(), hash])];
        saveUnlocked(hashes);
        showRooms(hashes);
        return true;
      }

      const urlKey = new URLSearchParams(location.hash.slice(1)).get('key');
      if (urlKey) history.replaceState(null, '', location.pathname + location.search);
      if (!(urlKey && await tryKey(urlKey))) showRooms(loadUnlocked());

      more.addEventListener('click', () => {
        more.hidden = true;
        gate.hidden = false;
        input.value = '';
        error.textContent = '';
        input.focus();
      });

      gate.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (await tryKey(input.value)) return;
        error.textContent = 'Неверный пароль';
        input.select();
        gate.classList.remove('secret-gate--shake');
        void gate.offsetWidth;
        gate.classList.add('secret-gate--shake');
      });
    })();
  </script>
</body>
</html>
