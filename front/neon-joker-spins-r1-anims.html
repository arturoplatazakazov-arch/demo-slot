<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Joker Spins R1 — все анимации игры</title>
<!-- Все анимации слота neon-joker-spins-r1.html одним столбцом по категориям, как
     volt-coins-v3-anim-lab.html: подпись слева (что, клип, длительность, когда в игре),
     справа — сама анимация на арте R1 (img/neon-joker-spins/skins/c/sets/r1). Игра без
     Spine: CSS-кадры повторены по правилам из css/neon-joker-spins.css и css/njs-r1.css,
     спрайты FX (fx/*.webp) летают на WAAPI как в slot.js; молния линий и граффити —
     настоящие js/neon-joker-spins/winlines.js и graffiti.js. Клик по сцене — повтор. -->
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root {
    --bg: #0c0518; --panel: #170a2b; --line: rgba(255, 60, 172, 0.16);
    --text: #f4ecff; --muted: #a99bc8; --accent: #2ce8ff; --pink: #ff3cac; --gold: #f5b400; --gold-hi: #ffd75a; --cyan: #2ce8ff;
    --cell: 132px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Baloo 2', system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
    padding: 12px 24px; background: rgba(12, 5, 24, 0.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255, 60, 172, 0.7); }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav a { color: var(--muted); text-decoration: none; font-size: 14px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); }
  nav a:hover { color: var(--accent); border-color: var(--accent); }
  .tools { margin-left: auto; display: flex; gap: 8px; }
  button.tool { font: inherit; font-size: 14px; color: var(--text); cursor: pointer; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(44, 232, 255, 0.35); background: var(--panel); }
  button.tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  main { padding: 0 24px 80px; max-width: 1400px; }
  .cat { padding-top: 26px; scroll-margin-top: 70px; }
  .cat > h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .cat > h2 span { font-size: 14px; font-weight: 500; color: var(--muted); }
  .cat > p { margin: 0 0 14px; color: var(--muted); font-size: 14px; max-width: 820px; line-height: 1.4; }
  .sub { margin: 22px 0 6px; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .row { display: grid; grid-template-columns: 290px 1fr; gap: 20px; padding: 16px 0; border-top: 1px solid var(--line); align-items: center; }
  .cap h3 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.2; }
  .cap .clip { margin-top: 4px; font-size: 13px; color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
  .cap p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.4; color: var(--muted); }
  .cap .kind { display: inline-block; margin-top: 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .stages { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  .st { display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
  .st > .lbl { font-size: 12px; color: var(--muted); }
  .click { cursor: pointer; }
  /* symbol sizes as in the game (njs-r1.css) */
  img.sym[src*="/seven."], img.sym[src*="/bell."], img.sym[src*="/star."] { scale: 1.1; }
  img.sym[src*="/scatter."] { scale: 1.15; }
  img.sym[src*="/cherry."], img.sym[src*="/lemon."], img.sym[src*="/plum."], img.sym[src*="/grape."] { scale: 0.8556; }

  /* ячейка барабана R1: тёмная колонка с неоновыми швами */
  .tile { position: relative; width: var(--cell); height: var(--cell); border-radius: 10px; overflow: visible;
    background: radial-gradient(120% 70% at 50% 45%, #241046, #12071f 78%); box-shadow: inset 0 0 0 1px rgba(44, 232, 255, 0.16); }
  .tile > img.sym { position: absolute; left: 5%; top: 5%; width: 90%; height: 90%; object-fit: contain; }
  .fxl { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 6; }
  .fx-sprite { position: absolute; left: 0; top: 0; pointer-events: none; mix-blend-mode: screen; will-change: transform, opacity; }

  /* окно 3x3 */
  .win3 { position: relative; display: grid; grid-template-columns: repeat(3, var(--cell)); grid-template-rows: repeat(3, var(--cell));
    background: #06020c; border-radius: 12px; padding: 0; overflow: visible; }
  .win3 .col { position: relative; overflow: hidden; grid-row: 1 / 4; border-left: 5px solid #06020c; border-right: 5px solid #06020c;
    background: radial-gradient(120% 70% at 50% 45%, #241046, #12071f 78%); }
  .win3 .col .strip { position: absolute; left: 0; top: 0; width: 100%; }
  .win3 .col .c { position: relative; height: var(--cell); width: 100%; }
  .win3 .col .c > img.sym { position: absolute; left: 6%; top: 6%; width: 88%; height: 88%; object-fit: contain; }
  .win3 .col.is-anticipating { background: radial-gradient(120% 70% at 50% 45%, #3a1260, #170828 78%); }
  .win3 .col.is-anticipating::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 26px 6px rgba(255, 60, 172, 0.85), inset 0 0 60px rgba(44, 232, 255, 0.45); animation: anticipate 520ms ease-in-out infinite alternate; }
  .win3::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 4;
    background: linear-gradient(90deg, transparent calc(100% / 3 - 1.5px), rgba(44, 232, 255, 0.55) calc(100% / 3 - 1.5px), rgba(44, 232, 255, 0.55) calc(100% / 3 + 1.5px), transparent calc(100% / 3 + 1.5px)),
      linear-gradient(90deg, transparent calc(200% / 3 - 1.5px), rgba(255, 60, 172, 0.55) calc(200% / 3 - 1.5px), rgba(255, 60, 172, 0.55) calc(200% / 3 + 1.5px), transparent calc(200% / 3 + 1.5px));
    filter: drop-shadow(0 0 6px rgba(255, 60, 172, 0.6)); }
  .win3 svg.win-line { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; z-index: 5; pointer-events: none; }
  .win3.hw .col { background: #0a0414; }

  /* сцены с артом */
  .scene { position: relative; overflow: hidden; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); background: #000; }
  .scene > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dark { border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); background: radial-gradient(ellipse at 50% 55%, #1e0c3a 0%, #0c0518 75%);
    padding: 22px; display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; position: relative; }
  .stage1600 { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
  .stage1600 > .bgimg { position: absolute; inset: 0; background: center / cover no-repeat; filter: brightness(0.58) saturate(0.82); }
  .graffiti { opacity: 0.55; }
  .graffiti .gf:has(text) { display: none; }

  /* glyph font */
  .glyphs { display: inline-flex; align-items: flex-end; justify-content: center; line-height: 1; white-space: nowrap; }
  .glyphs img { display: block; height: auto; margin: 0 -0.02em; }
  .glyphs img.g-comma { transform: translateY(30%); }

  /* монеты */
  .coin-val { position: absolute; font-size: 0; pointer-events: none; z-index: 2; display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 2px 0 #12001f) drop-shadow(0 0 5px rgba(10, 0, 20, 0.95)); }
  .coin-val img { max-height: 100%; max-width: 30%; }
  .coll .coin-val img { max-width: 24%; }
  .tile > img.back, .win3 .c > img.back { position: absolute; left: 3%; top: 3%; width: 94%; height: 94%; }
  .tile.hwspin::after { content: ''; position: absolute; inset: 14%; border-radius: 18%;
    background: repeating-linear-gradient(180deg, rgba(255, 215, 90, 0.0) 0 10px, rgba(255, 215, 90, 0.35) 10px 14px); animation: hw-spin 140ms linear infinite; filter: blur(1px); }

  /* game keyframes (css/neon-joker-spins.css, css/njs-r1.css) */
  .is-landing > img.sym { animation: cell-land 260ms ease-out; }
  .is-winning > img.sym { animation: cell-win 620ms ease-in-out; }
  .is-scatter > img.sym { animation: joker-idle 3.6s ease-in-out infinite; }
  .is-scatter.is-winning > img.sym { animation: joker-laugh 620ms ease-in-out; }
  .is-slam > img.sym { animation: coin-slam 420ms cubic-bezier(0.3, 1.5, 0.5, 1); }
  .is-collect > img.sym, .is-collect .coin-val { animation: coin-collect 420ms ease-out; }
  .is-charging > img.sym { animation: coin-charge 900ms ease-in-out; }
  @keyframes anticipate { from { opacity: 0.45; } to { opacity: 1; } }
  @keyframes cell-land { 0% { transform: scaleY(0.94) translateY(3%); } 100% { transform: none; } }
  @keyframes cell-win { 0%, 100% { transform: scale(1); filter: none; } 45% { transform: scale(1.12); filter: brightness(1.35) drop-shadow(0 0 14px rgba(255, 215, 90, 0.9)); } }
  @keyframes joker-idle { 0%, 86%, 100% { filter: none; } 90% { filter: brightness(1.4) drop-shadow(0 0 12px rgba(255, 60, 172, 0.9)); } }
  @keyframes joker-laugh { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-8deg) scale(1.14); filter: brightness(1.4) drop-shadow(0 0 18px #ff3cac); } 60% { transform: rotate(7deg) scale(1.1); } }
  @keyframes hw-spin { from { background-position: 0 0; } to { background-position: 0 28px; } }
  @keyframes coin-slam { 0% { transform: scale(1.6); opacity: 0; } 55% { transform: scale(0.92); opacity: 1; filter: brightness(1.7); } 100% { transform: scale(1); } }
  @keyframes coin-collect { 40% { transform: scale(1.18); filter: brightness(1.6) drop-shadow(0 0 16px #ffd75a); } }
  @keyframes coin-charge { 0%, 100% { transform: scale(1); } 30%, 70% { transform: scale(1.1); filter: brightness(1.5) drop-shadow(0 0 20px #2ce8ff); } }
  @keyframes logo-flicker { 0%, 93%, 96%, 100% { filter: none; } 94%, 95% { filter: brightness(0.75); } }
  @keyframes logo-flicker-now { 0%, 100% { filter: none; } 30%, 60% { filter: brightness(0.75); } }
  @keyframes mascot-idle { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(-0.6deg); } }
  @keyframes mascot-cheer { 0% { transform: scale(1); filter: drop-shadow(0 0 18px rgba(255, 60, 172, 0.25)); } 35% { transform: scale(1.05) rotate(-2deg); filter: drop-shadow(0 0 40px rgba(255, 215, 90, 0.8)) brightness(1.15); } 100% { transform: scale(1); } }
  @keyframes jp-hit { 0% { transform: scale(1); } 20% { transform: scale(1.18); filter: brightness(1.8) drop-shadow(0 0 30px #ffd75a); } 100% { transform: scale(1); } }
  @keyframes plus-pop { 0% { opacity: 0; transform: scale(0.3); } 20% { opacity: 1; transform: scale(1.3); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-20px); } }
  @keyframes panel-pulse { 40% { filter: brightness(1.5); } }
  @keyframes dialog-in { from { transform: scale(0.7); opacity: 0; } }
  @keyframes r1-neon-on { 0% { opacity: 0; filter: brightness(0.4); } 3% { opacity: 0.85; filter: brightness(1.3); } 5% { opacity: 0.1; } 8% { opacity: 0.9; } 10% { opacity: 0.25; } 14% { opacity: 1; filter: brightness(1.15); } 20%, 61% { opacity: 1; filter: none; } 62% { opacity: 0.7; } 63%, 100% { opacity: 1; filter: none; } }
  @keyframes r1-neon-off { 0% { opacity: 1; } 25% { opacity: 0.35; } 45% { opacity: 0.8; } 65% { opacity: 0.12; } 100% { opacity: 0; } }

  .logo-box img { width: 420px; display: block; animation: logo-flicker 7s linear infinite; }
  .logo-box img.now { animation: logo-flicker-now 300ms steps(1, end); }
  .mascot { height: 420px; display: block; transform-origin: 50% 100%; filter: drop-shadow(0 0 18px rgba(255, 60, 172, 0.25)); }
  .mascot.idle { animation: mascot-idle 4.2s ease-in-out infinite; }
  .mascot.is-cheer { animation: mascot-cheer 900ms cubic-bezier(0.3, 1.6, 0.5, 1); }

  /* инфо-плашка */
  .r1-plaque { position: relative; width: 420px; aspect-ratio: 2.8037; --u: calc(420px / 100); opacity: 0;
    background: url('img/neon-joker-spins/skins/c/sets/r1/img/plaque.webp?v=1') center / 100% 100% no-repeat; }
  .r1-plaque.is-on { animation: r1-neon-on 3.6s linear forwards; }
  .r1-plaque.is-off { animation: r1-neon-off 520ms steps(1, end) forwards; }
  .r1-plaque__face { position: absolute; left: 9%; right: 8%; top: 35%; bottom: 15%; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 3); }
  .r1-plaque__icon { height: 150%; aspect-ratio: 1; object-fit: contain; flex: none; filter: drop-shadow(0 0 calc(var(--u) * 2) var(--c)); }
  .r1-plaque__text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; font-family: 'Luckiest Guy', system-ui, sans-serif; }
  .r1-plaque__text b { font-weight: normal; font-size: calc(var(--u) * 9.6); letter-spacing: 0.03em; color: #fff; text-shadow: 0 0 calc(var(--u) * 0.8) var(--c), 0 0 calc(var(--u) * 2.4) var(--c), 0 0 calc(var(--u) * 5) var(--c); }
  .r1-plaque__text small { margin-top: calc(var(--u) * 1.2); font-size: calc(var(--u) * 4.4); letter-spacing: 0.06em; color: var(--c2); text-shadow: 0 0 calc(var(--u) * 1.6) var(--c2); }
  .r1-plaque[data-k="fs"] { --c: #ff3cac; --c2: #9ff4ff; }
  .r1-plaque[data-k="hw"] { --c: #ffb52e; --c2: #ffe9a8; }

  /* джекпоты */
  .jp { position: relative; background: center / 100% 100% no-repeat; }
  .jp .jp__value { position: absolute; left: calc(var(--win-l) * 100%); top: calc(var(--win-t) * 100%); width: calc(var(--win-ww) * 100%); height: calc(var(--win-hh) * 100%); display: flex; align-items: center; justify-content: center; }
  .jp .jp__value img { max-height: 72%; }
  .jp.is-hit { animation: jp-hit 1.2s ease-out; }

  /* панели FS / H&W */
  .side-panel { position: relative; width: 250px; padding: 18px 16px 20px; border-radius: 22px; text-align: center;
    background: linear-gradient(180deg, rgba(30, 12, 58, 0.92), rgba(12, 4, 24, 0.94));
    box-shadow: 0 0 0 3px #b98a1f, 0 0 0 6px rgba(255, 60, 172, 0.85), 0 0 26px rgba(255, 60, 172, 0.6), inset 0 0 26px rgba(44, 232, 255, 0.18); }
  .side-panel.is-pulse { animation: panel-pulse 520ms ease-out; }
  .side-panel__label { font-family: 'Luckiest Guy', system-ui, sans-serif; font-size: 24px; letter-spacing: 0.06em; color: var(--cyan); text-shadow: 0 0 10px rgba(44, 232, 255, 0.9), 0 0 22px rgba(44, 232, 255, 0.5); }
  .side-panel__label--sub { margin-top: 12px; font-size: 18px; color: #ff9bd6; text-shadow: 0 0 10px rgba(255, 60, 172, 0.9); }
  .side-panel__value { display: flex; justify-content: center; height: 70px; margin-top: 6px; }
  .side-panel__value img { height: 100%; width: auto; }
  .side-panel__value--sm { height: 40px; }
  .fs-plus { position: absolute; right: -24px; top: -18px; font-family: 'Luckiest Guy', system-ui, sans-serif; font-size: 48px; color: var(--gold-hi); text-shadow: 0 0 14px #ff3cac, 0 3px 0 #5a2a00; opacity: 0; }
  .fs-plus.is-on { animation: plus-pop 1.5s ease-out; }
  .hw-lamps { display: flex; gap: 14px; justify-content: center; margin: 10px 0 4px; }
  .hw-lamps.is-reset { animation: panel-pulse 600ms ease-out; }
  .hw-lamp { width: 30px; height: 30px; border-radius: 50%; background: #2a1838; box-shadow: inset 0 0 0 3px #6b4b18; transition: background 200ms ease, box-shadow 200ms ease; }
  .hw-lamp.is-lit { background: radial-gradient(circle at 40% 35%, #fff6c8, var(--gold) 55%, #a86a00); box-shadow: 0 0 14px var(--gold-hi), inset 0 0 0 3px #ffe9a0; }

  /* поле выигрыша */
  .reel-win { position: absolute; left: 0; right: 0; bottom: 18px; height: 64px; display: flex; justify-content: center; z-index: 6;
    opacity: 0; transform: translateY(10px); transition: opacity 250ms ease, transform 250ms ease; }
  .reel-win.is-on { opacity: 1; transform: none; }
  .reel-win .glyphs { height: 100%; padding: 4px 18px; border-radius: 16px; background: rgba(12, 4, 24, 0.72); box-shadow: 0 0 0 2px rgba(255, 215, 90, 0.6), 0 0 22px rgba(255, 60, 172, 0.55); }
  .reel-win .glyphs img { height: 86%; }

  /* попапы */
  .popscene { position: relative; width: 100%; max-width: 980px; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  .popscene > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.58) saturate(0.82); }
  .popscene .dim { position: absolute; inset: 0; background: rgba(8, 2, 16, 0.72); opacity: 0; transition: opacity 320ms ease; }
  .popscene.is-dim .dim { opacity: 1; }
  .popscene .fxl { z-index: 4; }
  .game-popup { position: absolute; left: 50%; top: 50%; width: min(620px, 70%); transform: translate(-50%, -50%) scale(0.6); opacity: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 2%; transition: transform 420ms cubic-bezier(0.3, 1.5, 0.5, 1), opacity 300ms ease; }
  .game-popup.is-in { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .game-popup.is-out { transform: translate(-50%, -50%) scale(1.15); opacity: 0; transition-duration: 260ms; }
  .game-popup__title-img { width: 100%; height: auto; filter: drop-shadow(0 0 24px rgba(255, 60, 172, 0.5)); }
  .game-popup__panel { position: relative; width: 78%; aspect-ratio: 900 / 264; background: center / 100% 100% no-repeat; display: flex; align-items: center; justify-content: center; }
  .game-popup__panel .glyphs { height: 58%; }
  .game-popup__panel .glyphs img { height: 100%; width: auto; }

  /* окно покупки */
  .buy-card { width: min(640px, 100%); padding: 22px 22px 18px; border-radius: 24px; text-align: center; background: linear-gradient(180deg, #23103f, #0e0619);
    box-shadow: 0 0 0 3px var(--gold), 0 0 0 6px var(--cyan), 0 0 40px rgba(44, 232, 255, 0.45); }
  .buy-card.is-in { animation: dialog-in 360ms cubic-bezier(0.3, 1.5, 0.5, 1); }
  .buy-card h4 { margin: 0; font-family: 'Luckiest Guy', system-ui, sans-serif; font-weight: normal; font-size: 30px; color: var(--gold-hi); text-shadow: 0 0 12px var(--pink); }
  .buy-cards { display: flex; gap: 18px; justify-content: center; margin: 14px 0 6px; }
  .buy-cards .bc { position: relative; flex: 0 1 240px; aspect-ratio: 0.643; background: center / contain no-repeat; }
  .buy-cards .bc span { position: absolute; left: 12%; right: 12%; top: 76.5%; height: 11%; display: flex; align-items: center; justify-content: center; font-family: 'Luckiest Guy', system-ui, sans-serif; font-size: 24px; color: #fff; text-shadow: 0 0 10px var(--c, #2ce8ff); }

  @media (max-width: 900px) { :root { --cell: 100px; } .row { grid-template-columns: 1fr; gap: 10px; } main { padding: 0 16px 60px; } }
</style>
</head>
<body>
<header>
  <a class="back" href="neon-joker-spins-r1.html">← К игре</a>
  <h1>Neon Joker Spins R1 — все анимации игры</h1>
  <nav id="nav"></nav>
  <div class="tools">
    <button type="button" class="tool" id="slowBtn" aria-pressed="false">Замедлить ×0.5</button>
    <button type="button" class="tool" id="replayBtn">Повторить все</button>
  </div>
</header>
<main id="root"></main>
<script>window.NJS_SKIN = 'c';</script>
<script src="js/neon-joker-spins/winlines.js?v=6"></script>
<script>
(async () => {
  const R = 'img/neon-joker-spins/skins/c/sets/r1';
  const C = 'img/neon-joker-spins/skins/c';
  const V = 'v=4';
  const sym = (c) => `${R}/symbols/${c}.webp?${V}`;
  const coin = (c) => `${R}/coins/${c}.webp?${V}`;
  const img = (c) => `${R}/img/${c}?${V}`;
  const root = document.getElementById('root');
  const nav = document.getElementById('nav');
  let speed = 1;
  const players = [];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms / speed));
  // CSS и WAAPI-анимации страницы идут со скоростью speed
  setInterval(() => { for (const a of document.getAnimations()) if (a.playbackRate !== speed) a.playbackRate = speed; }, 120);
  document.getElementById('slowBtn').addEventListener('click', (e) => {
    speed = speed === 1 ? 0.5 : 1;
    e.currentTarget.setAttribute('aria-pressed', String(speed !== 1));
  });
  document.getElementById('replayBtn').addEventListener('click', () => players.forEach((p) => p.run()));

  // ---------- разметка ----------
  let cat = null;
  const category = (id, title, note, text) => {
    cat = document.createElement('section');
    cat.className = 'cat';
    cat.id = id;
    cat.innerHTML = `<h2>${title}<span>${note}</span></h2>${text ? `<p>${text}</p>` : ''}`;
    root.appendChild(cat);
    nav.insertAdjacentHTML('beforeend', `<a href="#${id}">${title}</a>`);
  };
  const sub = (t) => cat.insertAdjacentHTML('beforeend', `<div class="sub">${t}</div>`);

    const w = window3(s, ['scatter', 'cherry', 'bell', 'lemon', 'scatter', 'plum', 'grape', 'seven', 'scatter']);
    player(w.box, () => {
      [0, 4, 8].forEach((i) => { const cell = w.cells[i]; restart(cell, 'is-winning', 640); const p = centre(cell, w.fx); burstAt(w.fx, p.x, p.y, 'heart', 5, cell.offsetWidth * 0.6, cell.offsetWidth * 0.3); ringAt(w.fx, p.x, p.y, 'ring_pink', cell.offsetWidth * 1.4, 700); });
    }, 2200);
  }

  // =====================================================================
  category('hw', 'Hold & Win', 'бонус: монеты, Коллектор, респины',
    '9 чётких ячеек, монеты держатся, 3 респина. Коллектор — монета своего цвета (заливной фиолетовый плазменный диск): с первого взгляда отличается от обычной.');
  {
    const s = row({ title: 'Монеты и номиналы', clip: 'blank + шрифт glyphs · Коллектор: сумма в нижней полосе', text: 'Номиналы набираются шрифтом с тёмным ореолом — читаются и короткие (5x), и длинные (1250x). Джекпот-монеты — свой арт с короной; GRAND с лаврами.', kind: 'статика' });
    const mk = (spec, lbl) => { const t = st(s, `<div class="tile"><img class="sym" alt=""></div>`, lbl); coinFace(t, spec); };
    mk({ v: 5 }, 'монета 5x'); mk({ v: 25 }, 'монета 25x'); mk({ v: 1250 }, 'длинная сумма'); mk({ coll: 1, v: 58 }, 'Коллектор');
    mk({ jp: 'mini' }, 'MINI'); mk({ jp: 'minor' }, 'MINOR'); mk({ jp: 'major' }, 'MAJOR'); mk({ jp: 'grand' }, 'GRAND');
    st(s, `<div class="tile"><img class="back" src="${coin('cell_empty')}"></div>`, 'пустая ячейка');
  }
  const HWB = [{ v: 5 }, { coll: 1 }, { e: 1 }, { e: 1 }, { v: 10 }, { v: 3 }, { v: 25 }, { jp: 'minor' }, { v: 15 }];
  const hwWindow = (s, lbl) => { const w = window3(s, Array(9).fill('coin'), { hw: true, lbl }); w.cells.forEach((c, i) => coinFace(c, HWB[i])); return w; };
  {
    const s = row({ title: 'Монета падает в ячейку', clip: 'coin-slam 0,42 с + искры', text: 'Новая монета на респине: влетает с увеличения со вспышкой, счётчик респинов снова 3.', kind: 'CSS + WAAPI' });
    const w = hwWindow(s);
    player(w.box, () => [0, 4, 8].forEach((i, n) => setTimeout(() => { restart(w.cells[i], 'is-slam', 440); const p = centre(w.cells[i], w.fx); burstAt(w.fx, p.x, p.y, 'spark', 8, 70, 38); }, (n * 260) / speed)), 2000);
  }
  {
    const s = row({ title: 'Зарядка монет', clip: 'coin-charge 0,9 с', text: 'Перед раскрытием номиналов все монеты на поле вспыхивают голубым.', kind: 'CSS' });
    const w = hwWindow(s);
    player(w.box, () => w.cells.forEach((c, i) => !HWB[i].e && restart(c, 'is-charging', 920)), 1800);
  }
  {
    const s = row({ title: 'Респин — пустые ячейки крутятся', clip: 'hw-spin 0,14 с · петля, пока идёт респин', text: 'Золотые полосы бегут в каждой пустой ячейке.', kind: 'CSS' });
    const w = hwWindow(s);
    player(w.box, async () => { [2, 3].forEach((i) => w.cells[i].classList.add('hwspin')); await wait(1500); [2, 3].forEach((i) => w.cells[i].classList.remove('hwspin')); }, 2300);
  }
  {
    const s = row({ title: 'Коллектор собирает', clip: 'ring_pink 0,7 с → искры от каждой монеты (flySpark) → счёт на Коллекторе → coin-slam + взрыв', text: 'Коллектор забирает сумму всех обычных монет на поле (джекпоты и другие Коллекторы — нет).', kind: 'CSS + WAAPI' });
    const w = hwWindow(s);
    player(w.box, async () => {
      const coll = w.cells[1];
      glyphs(coll._val, '0x');
      const to = centre(coll, w.fx);
      ringAt(w.fx, to.x, to.y, 'ring_pink', coll.offsetWidth * 1.6, 700);
      burstAt(w.fx, to.x, to.y, 'spark', 10, coll.offsetWidth * 0.7, coll.offsetWidth * 0.3);
      await wait(450);
      let acc = 0;
      for (const i of [0, 4, 5, 6, 8]) {
        restart(w.cells[i], 'is-collect', 420);
        flySpark(w.fx, centre(w.cells[i], w.fx), to, 420);
        await wait(300);
        acc += HWB[i].v;
        glyphs(coll._val, `${acc}x`);
      }
      await wait(200);
      restart(coll, 'is-slam', 440);
      burstAt(w.fx, to.x, to.y, 'burst', 1, 0, coll.offsetWidth * 1.2);
      burstAt(w.fx, to.x, to.y, 'spark', 12, coll.offsetWidth * 0.8, coll.offsetWidth * 0.3);
    }, 4600);
  }
  {
    const s = row({ title: 'Панель RESPINS', clip: 'лампы гаснут по одной · сброс на 3: panel-pulse 0,6 с', text: 'Пустой респин гасит лампу; новая монета возвращает все три со вспышкой. Сумма TOTAL растёт после Коллектора.', kind: 'CSS' });
    const a = st(s, '<div class="dark"><div class="side-panel"><div class="side-panel__label">RESPINS</div><div class="hw-lamps"><span class="hw-lamp"></span><span class="hw-lamp"></span><span class="hw-lamp"></span></div><div class="side-panel__label side-panel__label--sub">TOTAL</div><div class="side-panel__value side-panel__value--sm glyphs"></div></div></div>');
    const lamps = [...a.querySelectorAll('.hw-lamp')], L = a.querySelector('.hw-lamps'), tot = a.querySelector('.side-panel__value');
    const lit = (n) => lamps.forEach((l, i) => l.classList.toggle('is-lit', i < n));
    player(a, async () => { glyphs(tot, '58x'); lit(3); await wait(700); lit(2); await wait(700); lit(1); await wait(700); lit(3); restart(L, 'is-reset', 620); glyphs(tot, '83x'); }, 3200);
  }

  // =====================================================================
  category('jp', 'Джекпоты', 'плашки справа от барабанов',
    'Цвет тира одинаковый на плашке и на монете. Выигрыш тира: плашка вспыхивает и увеличивается, искры, кольцо, маскот кланяется.');
  {
    const WIN = { grand: [0.09, 0.579, 0.82, 0.282, 1.511], major: [0.088, 0.545, 0.822, 0.318, 1.579], minor: [0.092, 0.512, 0.817, 0.324, 1.662], mini: [0.1, 0.496, 0.807, 0.335, 1.719] };
    const VAL = { grand: '500k', major: '125k', minor: '25k', mini: '10k' };
    const s = row({ title: 'Выигрыш джекпота', clip: 'jp-hit 1,2 с + 14 искр + ring_cyan 0,7 с', text: 'MINI / MINOR / MAJOR — монета этого тира в Hold & Win; GRAND — все 9 ячеек заполнены.', kind: 'CSS + WAAPI' });
    const a = st(s, '<div class="dark" style="gap:30px;padding:34px 30px"></div>');
    const fx = document.createElement('div'); fx.className = 'fxl'; a.appendChild(fx);
    const plates = ['mini', 'minor', 'major', 'grand'].map((t) => {
      const [l, tp, ww, hh, ar] = WIN[t];
      const p = document.createElement('div');
      p.className = 'jp';
      const w = t === 'grand' ? 230 : 200;
      Object.assign(p.style, { width: `${w}px`, height: `${w / ar}px`, backgroundImage: `url('${img(`jp_${t}.webp`)}')` });
      [['--win-l', l], ['--win-t', tp], ['--win-ww', ww], ['--win-hh', hh]].forEach(([k, v]) => p.style.setProperty(k, v));
      p.innerHTML = '<span class="jp__value glyphs"></span>';
      a.appendChild(p);
      glyphs(p.querySelector('.jp__value'), VAL[t]);
      return p;
    });
    player(a, () => plates.forEach((p, n) => setTimeout(() => { restart(p, 'is-hit', 1250); const c = centre(p, fx); burstAt(fx, c.x, c.y, 'spark', 14, 140, 50); ringAt(fx, c.x, c.y, 'ring_cyan', 260, 700); }, (n * 600) / speed)), 4200);
  }

  // =====================================================================
  category('fs', 'Free Spins', 'бонус: 10 спинов на сцене',
    '3+ Джокера дают 10 Free Spins; во фриспинах 3+ Джокера добавляют +5. Фон — концертная сцена с прожекторами.');
  {
    const s = row({ title: 'Счётчик и +5 спинов', clip: 'спин: счётчик −1 · ретриггер: plus-pop 1,5 с + panel-pulse 0,52 с', text: 'Панель FREE SPINS справа от барабанов (на телефоне — горизонтально в поле выигрыша).', kind: 'CSS' });
    const a = st(s, `<div class="scene" style="width:520px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center"><img class="bg" style="filter:brightness(.8)" src="${img('bg_fs.jpg')}"><div class="side-panel"><div class="side-panel__label">FREE SPINS</div><div class="side-panel__value glyphs"></div><div class="side-panel__label side-panel__label--sub">WIN</div><div class="side-panel__value side-panel__value--sm glyphs"></div><div class="fs-plus"></div></div></div>`);
    const p = a.querySelector('.side-panel'), [left, win] = p.querySelectorAll('.side-panel__value'), plus = p.querySelector('.fs-plus');
    player(a, async () => {
      glyphs(left, '10'); glyphs(win, '0');
      await wait(700); glyphs(left, '9'); glyphs(win, '1,500');
      await wait(700); glyphs(left, '8');
      await wait(500); plus.textContent = '+5'; restart(plus, 'is-on', 1550); restart(p, 'is-pulse', 560); glyphs(left, '13'); glyphs(win, '4,000');
    }, 4200);
  }

  // =====================================================================
  category('popups', 'Попапы', 'вывески поверх затемнения',
    'Экран затемняется (0,32 с), вывеска-заголовок влетает с отскоком (0,42 с), сумма набегает счётчиком (до 1,4 с), держится, улетает (0,26 с). Тап пропускает. На MEGA / EPIC / TOTAL — конфетти.');
  const POPS = [
    ['bigWin', 'BIG WIN', 9000, false, 'Выигрыш от ×15 ставки.'],
    ['megaWin', 'MEGA WIN', 18500, true, 'От ×30 ставки.'],
    ['epicWin', 'EPIC WIN', 42000, true, 'От ×60 ставки.'],
    ['freeSpins', 'FREE SPINS', '10', false, 'Заставка входа во фриспины (в R1 вместо Spine-экрана старого Rock Chrome).'],
    ['holdAndWin', 'HOLD & WIN', null, false, 'Заставка входа в Hold & Win, без суммы.'],
    ['totalWin', 'TOTAL WIN', 26750, true, 'Итог Free Spins или Hold & Win.'],
  ];
  for (const [key, title, amount, conf, text] of POPS) {
    const s = row({ title, clip: `dim 0,32 с → вход 0,42 с → ${amount === null ? '' : 'счёт → '}держится 2,5 с → выход 0,26 с${conf ? ' · конфетти' : ''}`, text, kind: 'CSS + WAAPI' });
    const bg = key === 'freeSpins' || key === 'totalWin' ? 'bg_fs.jpg' : 'bg_base.jpg';
    const a = st(s, `<div class="popscene"><img class="bg" src="${img(bg)}"><div class="dim"></div><div class="fxl"></div></div>`);
    a.style.width = '760px';
    const fx = a.querySelector('.fxl');
    player(a, async () => {
      a.querySelectorAll('.game-popup').forEach((e) => e.remove());
      a.classList.add('is-dim');
      await wait(320);
      const n = document.createElement('div');
      n.className = 'game-popup';
      n.innerHTML = `<img class="game-popup__title-img" src="${C}/popups/${key}.webp?${V}" alt="">${amount === null ? '' : `<div class="game-popup__panel" style="background-image:url('${C}/popups/panel.webp?${V}')"><span class="glyphs"></span></div>`}`;
      a.appendChild(n);
      void n.offsetWidth;
      n.classList.add('is-in');
      const g = n.querySelector('.glyphs');
      if (g) {
        if (typeof amount === 'string') glyphs(g, amount);
        else for (let k = 0; k <= 28; k++) setTimeout(() => glyphs(g, fmt((amount * k) / 28)), (50 * k) / speed);
      }
      if (conf) confetti(fx, 2400);
      await wait(420 + 2500);
      n.classList.remove('is-in'); n.classList.add('is-out');
      await wait(260);
      n.remove();
      a.classList.remove('is-dim');
    }, 4900);
  }

  // =====================================================================
  category('buy', 'Покупка', 'окно Buy Bonus',
    'Кнопка Buy — в меню нижней панели (на поле её нет). Окно с двумя бонусами: Hold & Win покупается (34,5× ставки), Free Spins — макет будущей покупки (100× ставки).');
  {
    const s = row({ title: 'Окно покупки', clip: 'dialog-in 0,36 с · cubic-bezier(.3, 1.5, .5, 1)', text: 'Затемнение экрана и окно с отскоком. Карточки — неоновые вывески с ценой в окне.', kind: 'CSS' });
    const a = st(s, `<div class="dark" style="padding:30px;width:760px;max-width:100%"><div class="buy-card"><h4>BUY BONUS</h4><div class="buy-cards"><div class="bc" style="--c:#ff3cac;background-image:url('${img('buy_fs.webp')}')"><span>50,000</span></div><div class="bc" style="background-image:url('${img('buy_hw.webp')}')"><span>17,250</span></div></div></div></div>`);
    player(a, () => restart(a.querySelector('.buy-card'), 'is-in', 400), 2600);
  }
})();
</script>
</body>
</html>
