<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Gangsta Casino — снимок экрана для локализации</title>
<!--
  Headless-friendly harness: draws ONE of the game's two full-screen Spine packs
  (feature / bonus) at a fixed moment of its intro, in the game's own layout box,
  with no captions — the caption boxes come back as geometry so the localisation
  preview can draw each language's text into them offline, at the one fixed size
  the game uses (front/js/gangsta-casino/slot.js PACK_CAPTIONS).
    ?screen=feature|bonus  ?lay=desk|mob  ?seek=<seconds into intro>
  window.__shot() -> { img: <dataURL>, w, h, caps: [{key,x,y,s,w,h,lines,line,f}] }
-->
<style>
  html, body { margin: 0; background: #07070c; }
  #wrap { position: relative; }
  #stage { position: absolute; inset: 0; background: #07070c no-repeat center / cover; }
  #stage::after { content: ''; position: absolute; inset: 0; background: rgba(4, 4, 8, 0.88); }
  #spineCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div><canvas id="spineCanvas"></canvas></div>
<script src="vendor/spine-webgl.js"></script>
<script src="js/spine-engine.js"></script>
<script>
const P = new URLSearchParams(location.search);
const SCREEN = P.get('screen') === 'bonus' ? 'bonus' : 'feature';
const LAY = P.get('lay') === 'mob' ? 'mob' : 'desk';
const SEEK = Number(P.get('seek') || 2.9);

// the game's own design canvases (slot.js FEATURE_BOX / FEATURE_BOX_MOB)
const BOX = LAY === 'desk' ? { x: -966, y: -470, width: 1932, height: 940 }
                           : { x: -390, y: -708, width: 780, height: 1416 };
const W = LAY === 'desk' ? 1400 : 600;
const H = Math.round(W * BOX.height / BOX.width);

// slot.js PACK_CAPTIONS: [bone, EN text, box w, box h, lines, line height, fixed factor]
const CAPS = {
  feature: {
    desk: [['free_spins', 'text_free_spins', 240, 66, 2, 66, 0.794], ['expanding_wild', 'text_expanding_wild', 279, 66, 2, 66, 0.762],
      ['multiplier', 'text_multiplier', 240, 42, 1, 42, 0.985], ['multiplier_note', 'text_multiplier_note', 273, 27, 1, 27, 0.854],
      ['tap_to_continue', 'text_tap_to_continue', 400, 116, 2, 58, 0.999]],
    mob: [['free_spins', 'text_free_spins', 240, 74, 2, 74, 0.794], ['expanding_wild', 'text_expanding_wild', 279, 86, 2, 86, 0.585],
      ['multiplier', 'text_multiplier', 240, 47, 1, 47, 0.879], ['multiplier_note', 'text_multiplier_note', 244, 27, 1, 27, 0.762],
      ['tap_to_continue', 'text_tap_to_continue', 400, 116, 2, 58, 1.001]],
  },
  bonus: {
    desk: [['bonus_game', 'text_bonus_game', 266, 71, 0, 71, 0.698], ['tap_to_start', 'text_tap_to_start', 462, 58, 0, 58, 0.843]],
    mob: [['bonus_game', 'text_bonus_game', 266, 71, 0, 71, 0.698], ['tap_to_start', 'text_tap_to_start', 538, 58, 0, 58, 0.982]],
  },
};
// ?dom=1 — draw the captions the way the GAME draws them (its own .pack-caption CSS, pinned to
// the bone), to check the live rendering, not just the geometry.
const EN = { free_spins: 'FREE SPINS', expanding_wild: 'EXPANDING WILD', multiplier: 'MULTIPLIER',
             multiplier_note: 'ADD UP IN FREE SPINS', tap_to_continue: 'TAP TO CONTINUE',
             bonus_game: 'BONUS GAME', tap_to_start: 'TAP TO START' };

const wrap = document.getElementById('wrap');
const stageEl = document.getElementById('stage');
const cv = document.getElementById('spineCanvas');
wrap.style.width = W + 'px';
wrap.style.height = H + 'px';
stageEl.style.backgroundImage =
  `url(img/gangsta-casino/bg_${SCREEN === 'bonus' ? 'bonus' : 'base'}_${LAY}.jpg)`;
// one device pixel per CSS pixel, and a buffer we can read back after the frame
cv.width = W; cv.height = H;
cv.getContext('webgl', { alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
Object.defineProperty(window, 'devicePixelRatio', { get: () => 1 });

const stage = new SpineEngine.SpineStage(cv);
let INST = null;
window.__err = null;

SpineEngine.SpineResource.load(stage.assetManager, `img/gangsta-casino/spine-pack/${SCREEN}_screen`,
                               { premultipliedAlpha: true })
  .then((res) => {
    const inst = res.createInstance();
    const skin = new spine.Skin('screen');
    skin.addSkin(res.skeletonData.findSkin(LAY));
    inst.skeleton.setSkin(skin);
    inst.skeleton.setSlotsToSetupPose();
    inst.anchorEl = stageEl;
    inst.fit = 1;
    inst.boundsOverride = BOX;
    stage.addOverlay(inst);
    inst.play('intro', false);
    inst.queue('idle', true);
    const entry = inst.animationState.getCurrent(0);
    if (entry && SEEK > 0) entry.trackTime = SEEK;
    INST = inst;
  })
  .catch((e) => { window.__err = String(e); });

if (P.get('dom')) {
  for (const href of ['css/fonts.css', 'css/gangsta-casino.css']) {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href;
    document.head.appendChild(l);
  }
  const pre = LAY === 'mob' ? 'm_' : '';
  const els = CAPS[SCREEN][LAY].map(([key, bone, w, h, lines, line, f]) => {
    const el = document.createElement('div');
    el.className = lines ? 'pack-caption pack-caption--fit' : 'pack-caption';
    el.textContent = EN[key];
    document.body.appendChild(el);
    return { el, bone: pre + bone, w, h, lines, line, f };
  });
  const tick = () => {
    requestAnimationFrame(tick);
    if (!INST) return;
    const r = cv.getBoundingClientRect();
    for (const c of els) {
      const b = INST.skeleton.findBone(c.bone);
      if (!b) continue;
      const s = b.getWorldScaleX();
      c.el.style.left = `${r.left + b.worldX + cv.width / 2}px`;
      c.el.style.top = `${r.top + cv.height / 2 - b.worldY}px`;
      c.el.style.fontSize = `${(c.line || c.h) * 0.62 * s * c.f}px`;
      c.el.style.width = `${c.w * s}px`;
      c.el.style.maxWidth = `${c.w * s}px`;
      c.el.style.height = `${c.h * s}px`;
    }
  };
  requestAnimationFrame(tick);
}

window.__ready = () => !!INST &&
  !!INST.skeleton.findBone((LAY === 'mob' ? 'm_' : '') + CAPS[SCREEN][LAY][0][1]);

// Caption geometry in canvas pixels (the game's boneOnScreen, dpr = 1 here).
window.__shot = () => {
  const r = cv.getBoundingClientRect();
  const pre = LAY === 'mob' ? 'm_' : '';        // slot.js: the mob layout's own bones
  const caps = CAPS[SCREEN][LAY].map(([key, bone, w, h, lines, line, f]) => {
    bone = pre + bone;
    const b = INST.skeleton.findBone(bone);
    return b && {
      key, bone, w, h, lines, line, f,
      x: (b.worldX + cv.width / 2) - (r.left - r.left),
      y: (cv.height / 2 - b.worldY),
      s: b.getWorldScaleX(),
    };
  }).filter(Boolean);
  return { img: cv.toDataURL('image/png'), w: W, h: H, screen: SCREEN, lay: LAY, caps };
};
</script>
</body>
</html>
