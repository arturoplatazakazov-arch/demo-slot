<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Great Uniqorn — Scatter Spine</title>
<style>
  :root { --bg: #0d1030; --panel: #182060; --line: #d9a441; --text: #f4e6c4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 30%, #1d2878, var(--bg) 70%); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; gap: 22px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
  .card { background: rgba(10, 14, 50, .7); border: 1px solid rgba(217, 164, 65, .45); border-radius: 18px; padding: 18px; }
  .hero { width: 340px; height: 354px; position: relative; display: grid; place-items: center; }
  .hero .cell { width: 230px; height: 240px; position: relative; }
  .cell img.static { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; pointer-events: none; }
  body.show-static .cell img.static.scatter { opacity: .5; }
  .grid { display: grid; grid-template-columns: repeat(5, 92px); grid-template-rows: repeat(3, 96px);
    background: linear-gradient(#1a2a7a, #13205e); border: 3px solid var(--line); border-radius: 10px; }
  .grid .cell { position: relative; border-right: 1px solid rgba(217,164,65,.25); }
  .grid .cell:nth-child(5n) { border-right: 0; }
  .grid .cell img.sym { position: absolute; inset: 4%; width: 92%; height: 92%; object-fit: contain; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 720px; }
  button { background: var(--panel); color: var(--text); border: 1px solid rgba(217,164,65,.6); border-radius: 999px;
    padding: 8px 16px; font: inherit; cursor: pointer; }
  button.on { background: #d9a441; color: #2a1600; }
  .note { max-width: 720px; opacity: .75; text-align: center; font-size: 13px; }
  #spineCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .label { text-align: center; margin-top: 10px; font-size: 13px; opacity: .8; }
</style>
</head>
<body>
  <h1>GREAT UNIQORN · SCATTER (Spine)</h1>
  <div class="controls" id="controls">
    <button data-anim="idle" class="on">Idle</button>
    <button data-anim="land">Land</button>
    <button data-anim="win">Win</button>
    <button data-anim="cycle">Land → Win → Idle</button>
    <button id="slow">Скорость ×0.5</button>
    <button id="static">Сравнить со статикой</button>
  </div>
  <div class="row">
    <div>
      <div class="card hero"><div class="cell" id="heroCell"><img class="static scatter" src="img/great-uniqorn/spine/scatter/static.png" alt=""></div></div>
      <div class="label">крупно</div>
    </div>
    <div>
      <div class="card"><div class="grid" id="grid"></div></div>
      <div class="label">в сетке 5×3 (размер ячейки как на слоте)</div>
    </div>
  </div>
  <div class="note">Демо-страница: на слот не подключено. Скелет собирается скриптом scripts/great_uniqorn_scatter_spine.py
    из ваших слоёв (бургер по частям + статика + надпись).</div>
  <canvas id="spineCanvas"></canvas>

  <script src="vendor/spine-webgl.js"></script>
  <script src="js/spine-engine.js"></script>
  <script>
  (async () => {
    const V = Date.now();
    const SYM = 'img/great-uniqorn/symbols/';
    const layout = ['k','jet','scatter','docs','a', 'q','scatter','hair','wild','j', 'a','docs','k','scatter','x3'];
    const grid = document.getElementById('grid');
    const cells = [];
    for (const code of layout) {
      const c = document.createElement('div');
      c.className = 'cell';
      if (code === 'scatter') {
        c.innerHTML = '<img class="static scatter" src="img/great-uniqorn/spine/scatter/static.png" alt="">';
        cells.push(c);
      } else {
        c.innerHTML = `<img class="sym" src="${SYM}${code}.png?v=3" alt="">`;
      }
      grid.appendChild(c);
    }
    const stage = new SpineEngine.SpineStage(document.getElementById('spineCanvas'));
    const res = await SpineEngine.SpineResource.load(stage.assetManager, 'img/great-uniqorn/spine/scatter', { version: V });
    const insts = [];
    const anchors = [document.getElementById('heroCell'), ...cells];
    for (const el of anchors) {
      const inst = res.createInstance();
      inst.anchorEl = el;
      // Skeleton bounds are 2x the tile (room for the win burst), so fit 2 =
      // the tile fills the anchor exactly; the burst may overflow it.
      inst.fit = el.id === 'heroCell' ? 2 : 2 * 0.92;
      inst.play('idle', true);
      stage.addBase(inst);
      insts.push(inst);
    }
    window.scatterDemo = { insts };
    let speed = 1;
    const setSpeed = () => insts.forEach((i) => { i.animationState.timeScale = speed; });
    const play = (name) => {
      insts.forEach((inst, k) => {
        const st = inst.animationState;
        if (name === 'cycle') {
          st.setAnimation(0, 'land', false);
          st.addAnimation(0, 'win', false, 0.25 + k * 0.08);
          st.addAnimation(0, 'idle', true, 0);
        } else if (name === 'idle') {
          st.setAnimation(0, 'idle', true);
        } else {
          st.setAnimation(0, name, name === 'win');
          if (name !== 'win') st.addAnimation(0, 'idle', true, 0);
        }
      });
    };
    document.querySelectorAll('[data-anim]').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('[data-anim]').forEach((x) => x.classList.toggle('on', x === b));
      play(b.dataset.anim);
    }));
    document.getElementById('slow').addEventListener('click', (e) => {
      speed = speed === 1 ? 0.5 : 1; e.target.classList.toggle('on', speed !== 1); setSpeed();
    });
    document.getElementById('static').addEventListener('click', (e) => {
      e.target.classList.toggle('on', document.body.classList.toggle('show-static'));
    });
  })();
  </script>
</body>
</html>
