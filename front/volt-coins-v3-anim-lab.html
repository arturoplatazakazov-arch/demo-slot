<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volt Coins V3 — все анимации игры</title>
<!-- Все анимации, которые играют на странице слота (volt-coins-v3.html), одним
     столбцом по категориям: подпись слева (что, клип, длительность, когда в игре),
     справа — сама анимация. Spine — те же скелеты, что грузит игра
     (fx/sym_*, fx/frame, fx/logo, fx/cellbolt, fx/arc, fx/popups/*, screens/*);
     CSS/DOM-эффекты (неон рамы, вспышки катушек, плашки джекпотов) повторены
     по правилам из css/volt-coins-v3.css и js/volt-coins-v3/fx.js.
     Spine рисуется на одном фиксированном канвасе поверх страницы, каждый
     инстанс привязан к своему боксу (anchorEl); попапы с дождём — свои
     два канваса (монеты из-за попапа и перед суммой). -->
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root {
    --bg: #070a1c;
    --panel: #0d1330;
    --line: rgba(160, 190, 255, 0.14);
    --text: #e8f0ff;
    --muted: #8d9bc4;
    --accent: #39d8ff;
    --cell-w: 200px;
    --cell-h: calc(var(--cell-w) * 254 / 320);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Baloo 2', system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
    padding: 12px 24px; background: rgba(7, 10, 28, 0.94);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255, 201, 60, 0.6); }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav a {
    color: var(--muted); text-decoration: none; font-size: 14px;
    padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
  }
  nav a:hover { color: var(--accent); border-color: var(--accent); }
  .tools { margin-left: auto; display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 14px; color: var(--text); cursor: pointer;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(160, 190, 255, 0.35); background: var(--panel);
  }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  main { padding: 0 24px 80px; max-width: 1400px; }

  /* категория */
  .cat { padding-top: 26px; scroll-margin-top: 70px; }
  .cat > h2 {
    margin: 0 0 4px; font-size: 26px; font-weight: 800; letter-spacing: 0.02em;
    display: flex; align-items: baseline; gap: 12px;
  }
  .cat > h2 span { font-size: 14px; font-weight: 500; color: var(--muted); }
  .cat > p { margin: 0 0 14px; color: var(--muted); font-size: 14px; max-width: 820px; line-height: 1.4; }
  .sub { margin: 22px 0 6px; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  /* строка = одна анимация: подпись | сцена */
  .row {
    display: grid; grid-template-columns: 290px 1fr; gap: 20px;
    padding: 16px 0; border-top: 1px solid var(--line); align-items: center;
  }
  .cap h3 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.2; }
  .cap .clip { margin-top: 4px; font-size: 13px; color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
  .cap p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.4; color: var(--muted); }
  .cap .kind {
    display: inline-block; margin-top: 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted);
  }
  .stages { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  .st { display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
  .st:has(> .popdemo), .st:has(> .scrbox.desk) { flex: 1 1 100%; }
  .st > .lbl { font-size: 12px; color: var(--muted); }

  /* ячейка барабана */
  .tilebox {
    position: relative; width: var(--cell-w); height: var(--cell-h); border-radius: 10px; cursor: pointer;
    background: #031a51;
    box-shadow: inset 0 0 34px rgba(1, 74, 179, 0.75), inset 0 0 0 1px rgba(160, 190, 255, 0.18);
  }
  .tilebox img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .tilebox.is-hidden-img img { visibility: hidden; }

  /* сцена с подложкой-артом (рама, лого, катушки) */
  .artbox { position: relative; cursor: pointer; }
  .artbox > img.back { display: block; width: 100%; height: 100%; }
  .darkstage {
    border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line);
    background: radial-gradient(ellipse at 50% 55%, #10204a 0%, #070a1c 75%);
    padding: 18px; display: flex; align-items: center; justify-content: center;
  }

  canvas#lab { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 3; }

  /* неон в желобе рамы — копия .v3-neon из css/volt-coins-v3.css */
  .v3-neon { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: visible; opacity: 0; }
  .v3-neon rect { fill: none; stroke-linecap: round; }
  .v3-neon { --n-core: #e8fbff; --n-glow: #39b8ff; --n-tail: #5fd2ff; --n-sh1: #8fe8ff; --n-sh2: #39d8ff; }
  .v3-neon__glow { stroke: var(--n-glow); stroke-width: 16; filter: blur(6px); opacity: 0.95; }
  .v3-neon__core { stroke: var(--n-core); stroke-width: 5; filter: drop-shadow(0 0 3px var(--n-sh1)) drop-shadow(0 0 7px var(--n-sh2)); }
  .v3-neon__tail { stroke: var(--n-tail); stroke-width: 4.5; opacity: 0.6; filter: drop-shadow(0 0 5px var(--n-sh2)); }
  .v3-neon[data-tone="mini"]  { --n-core: #ffe6cc; --n-glow: #d9822b; --n-tail: #eaa060; --n-sh1: #ffb877; --n-sh2: #c8691c; }
  .v3-neon[data-tone="minor"] { --n-core: #ffffff; --n-glow: #b9c8dc; --n-tail: #dfe7f2; --n-sh1: #eef4ff; --n-sh2: #9fb3cc; }
  .v3-neon[data-tone="major"] { --n-core: #fff6cc; --n-glow: #ffbf1a; --n-tail: #ffd75a; --n-sh1: #ffe28a; --n-sh2: #f0a800; }
  .v3-neon[data-tone="green"] { --n-core: #eaffea; --n-glow: #2fe86a; --n-tail: #6cf59a; --n-sh1: #a4ffbe; --n-sh2: #1fcf55; }
  .v3-neon .v3-neon__core, .v3-neon .v3-neon__glow { stroke-dasharray: 230 1049.5; }
  .v3-neon .v3-neon__tail { stroke-dasharray: 590 689.5; }
  .v3-neon.is-run { animation: v3-neon-fade 1700ms ease-in-out forwards; }
  .v3-neon.is-run .v3-neon__core, .v3-neon.is-run .v3-neon__glow { animation: v3-neon-lap 1700ms cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
  .v3-neon.is-run .v3-neon__tail { animation: v3-neon-lap-tail 1700ms cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
  .v3-neon.is-loop { opacity: 1; }
  .v3-neon.is-loop .v3-neon__core, .v3-neon.is-loop .v3-neon__glow { animation: v3-neon-lap 2000ms linear infinite; }
  .v3-neon.is-loop .v3-neon__tail { animation: v3-neon-lap-tail 2000ms linear infinite; }
  @keyframes v3-neon-fade { 0% { opacity: 0; } 22% { opacity: 1; } 72% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes v3-neon-lap      { from { stroke-dashoffset: 0; }   to { stroke-dashoffset: -2559; } }
  @keyframes v3-neon-lap-tail { from { stroke-dashoffset: 360; } to { stroke-dashoffset: -2199; } }
  .neonbox .reelbg { position: absolute; left: 5.6%; top: 6.1%; width: 88.8%; height: 87.8%; border-radius: 8px; background: url(img/volt-coins-v3/v3/reel_bg.png) 0 0 / 100% 100%; }
  .neonbox > img.back { position: relative; z-index: 2; }

  /* вспышки катушек — копия .v3-flash (fx.js makeCoilFlash) */
  .coilbox { width: 130px; aspect-ratio: 330 / 640; margin: 90px 110px 80px; }
  .coilbox img.back { position: relative; z-index: 2; }
  .coilbox .flash { position: absolute; opacity: 0; pointer-events: none; z-index: 1; max-width: none; }

  /* плашки джекпотов — jp-hit / jp-won */
  .jpbox { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; padding: 14px 18px; }
  .jpbox img { height: 44px; display: block; }
  .jpbox .grand img { height: 56px; }
  .jpbox .plate span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
  .jpbox .plate { position: relative; }
  .jpbox .plate.is-hit { animation: jp-hit 700ms cubic-bezier(0.2, 1.3, 0.4, 1); }
  .jpbox .plate.is-won { animation: jp-won 420ms ease-in-out infinite; }
  @keyframes jp-hit { 0% { transform: scale(1); filter: brightness(1); } 20% { transform: scale(1.12); filter: brightness(1.9); } 100% { transform: scale(1); filter: brightness(1); } }
  @keyframes jp-won { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.7); } }

  /* разряд катушка → монета */
  .arcbox { display: flex; align-items: center; gap: 0; padding: 10px 18px; }
  .arcbox .coilimg { height: 170px; }
  .arcbox .arcanchor { width: 420px; height: 59px; }
  .arcbox .coinimg { width: 130px; }
  /* разряд катушка ↔ монета: голова катушки на высоте центра монеты */
  .duo { align-items: flex-start; padding: 150px 40px 30px; }
  .duo .duo-gap { width: 360px; }
  .duo .coilbox--duo { width: 110px; margin: calc(var(--cell-h) / 2) 0 0; }

  /* фон игры: база / бонус (фильтры как в css/volt-coins-v3.css, 2026-11-09) */
  .bgbox { position: relative; overflow: hidden; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); }
  .bgbox img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .bgbox.desk { width: 420px; aspect-ratio: 1948 / 1096; }
  .bgbox.mob { width: 190px; aspect-ratio: 805 / 1431; }
  .bgbox.base img { filter: brightness(0.68) saturate(1.05); }
  .bgbox.bonus img { filter: brightness(0.97) saturate(1.15) hue-rotate(-8deg); }
  .bgbox::after { content: ''; position: absolute; inset: 0; pointer-events: none; }
  .bgbox.base::after { background: radial-gradient(60% 55% at 50% 50%, transparent 45%, rgba(2, 4, 16, 0.55) 78%, rgba(2, 4, 16, 0.85) 100%); }
  .bgbox.bonus::after { background: radial-gradient(70% 40% at 50% 0%, rgba(255, 196, 70, 0.14), transparent 70%), radial-gradient(60% 55% at 50% 50%, transparent 60%, rgba(2, 4, 20, 0.12) 85%, rgba(2, 4, 20, 0.22) 100%); }

  /* табличка респинов — копия .v3resp (горизонтальная, как на мобиле) */
  .respduo { align-items: center; gap: 0; padding: 40px 36px; }
  .respduo .duo-gap { width: 300px; }
  .respbox { position: relative; width: 320px; aspect-ratio: 424 / 89; cursor: pointer; }
  .respbox .v3resp__art { display: block; width: 100%; height: 100%; }
  .v3resp__n {
    position: absolute; top: 50%; width: 0; display: flex; justify-content: center;
    font-family: 'Roboto', system-ui, sans-serif; font-weight: 900; font-size: 29px; line-height: 1;
    color: #fff; text-shadow: 0 0 6px #8fe8ff, 0 0 16px #39d8ff, 0 2px 0 rgba(0, 0, 0, 0.5);
    transform: translateY(-50%); transition: color 240ms ease, text-shadow 240ms ease, opacity 300ms ease;
  }
  .v3resp__n[data-n="1"] { left: 16.04%; }
  .v3resp__n[data-n="2"] { left: 50%; }
  .v3resp__n[data-n="3"] { left: 83.96%; }
  .v3resp__n:not(.is-on) { opacity: 0.28; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
  @keyframes v3resp-fill {
    0%   { opacity: 0.28; transform: translateY(-50%) scale(0.7); filter: none; }
    45%  { opacity: 1; transform: translateY(-50%) scale(1.6); filter: brightness(2.4) drop-shadow(0 0 12px #8fe8ff); }
    100% { opacity: 1; transform: translateY(-50%) scale(1); filter: none; }
  }
  .respbox.is-fill .v3resp__n { animation: v3resp-fill 520ms cubic-bezier(0.2, 0.8, 0.3, 1) backwards; }
  .respbox.is-fill .v3resp__n[data-n="2"] { animation-delay: 110ms; }
  .respbox.is-fill .v3resp__n[data-n="3"] { animation-delay: 220ms; }
  @keyframes v3resp-reset { 0% { filter: brightness(1); } 25% { filter: brightness(2.3) drop-shadow(0 0 14px #39d8ff); } 100% { filter: brightness(1); } }
  .respbox.is-reset .v3resp__art { animation: v3resp-reset 800ms ease-out; }
  @keyframes v3resp-tick {
    0%   { opacity: 1; transform: translateY(-50%) scale(1); filter: none; color: #fff; }
    22%  { opacity: 1; transform: translateY(-50%) scale(2); filter: brightness(1.35) drop-shadow(0 0 14px #ff7a2d); color: #ffb35a; }
    55%  { opacity: 0.9; transform: translateY(-50%) scale(0.85); color: #ff8a3d; }
    100% { opacity: 0.28; transform: translateY(-50%) scale(1); filter: none; }
  }
  .v3resp__n.is-tick { animation: v3resp-tick 700ms cubic-bezier(0.2, 0.8, 0.3, 1); }
  @keyframes v3resp-shake { 0%, 100% { translate: 0 0; } 15% { translate: -4px 1px; } 35% { translate: 4px -1px; } 55% { translate: -3px 0; } 75% { translate: 2px 0; } }
  @keyframes v3resp-dim { 0% { filter: brightness(1); } 20% { filter: brightness(0.55) saturate(1.4) hue-rotate(-25deg); } 100% { filter: brightness(1); } }
  .respbox.is-tick { animation: v3resp-shake 420ms ease-out; }
  .respbox.is-tick .v3resp__art { animation: v3resp-dim 700ms ease-out; }

  /* сбор монет (как slot.js collectCoins) */
  .collectbox { padding: 26px; }
  .cgrid { position: relative; display: grid; grid-template-columns: repeat(3, 132px); grid-template-rows: repeat(3, 120px);
    border-radius: 10px; background: url(img/volt-coins-v3/v3/reel_bg.png) 0 0 / 100% 100%; cursor: pointer; }
  .cgrid .cc { position: relative; }
  .cgrid .cc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .cgrid .ghost { position: absolute; z-index: 2; will-change: transform; }
  .cgrid .ghost img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .cgrid .big { position: absolute; z-index: 3; transform: scale(0.2); opacity: 0; pointer-events: none; }
  .cgrid .big > img { position: absolute; }
  .cgrid .big .coin { inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 18px rgba(255, 200, 80, 0.75)); }
  .cgrid .big .aura { left: -15%; top: -15%; width: 130%; height: 130%; opacity: 0; mix-blend-mode: screen; animation: collect-aura 1.5s linear infinite; }
  .cgrid .big .aura.a2 { animation-delay: -0.75s; }
  .cgrid .big .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .cgrid .big .glyphs { display: inline-flex; align-items: flex-end; line-height: 1; }
  .cgrid .big .glyphs img { display: block; flex: 0 0 auto; }
  .cgrid .big .burst { position: absolute; left: 50%; top: 50%; width: 140%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 245, 200, 0.95), rgba(255, 196, 60, 0.55) 45%, rgba(255, 160, 0, 0) 100%); opacity: 0; mix-blend-mode: screen; }
  .cgrid .big.is-in { animation: collect-in 520ms cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
  .cgrid .big.is-in .burst { animation: collect-burst 700ms ease-out forwards; }
  .cgrid .big.is-done .lbl { animation: collect-done 420ms cubic-bezier(0.2, 1.5, 0.4, 1); }
  .cgrid .big.is-out { animation: collect-out 300ms ease-in forwards; }
  @keyframes collect-aura { 0% { opacity: 0; transform: rotate(0deg) scale(0.92); } 25% { opacity: 1; } 60% { opacity: 0.85; } 100% { opacity: 0; transform: rotate(46deg) scale(1.04); } }
  @keyframes collect-in { 0% { transform: scale(0.2); opacity: 0; } 60% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes collect-burst { 0% { opacity: 0; transform: scale(0.3); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
  @keyframes collect-done { 0% { transform: scale(1); filter: brightness(1); } 40% { transform: scale(1.25); filter: brightness(1.8); } 100% { transform: scale(1); filter: brightness(1); } }
  @keyframes collect-out { from { transform: scale(1); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
  /* попап (+ дождь) в кадре игры */
  .popdemo {
    position: relative; width: 100%; max-width: 1000px; aspect-ratio: 1932 / 940; overflow: hidden; border-radius: 12px; cursor: pointer;
    background: url(img/volt-coins-v3/v3/bg_desk.jpg) center / cover; box-shadow: inset 0 0 0 1px var(--line);
  }
  .popdemo::after { content: ''; position: absolute; inset: 0; background: rgba(2, 4, 16, 0.7); z-index: 0; }
  .popdemo canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .popdemo .c-back { z-index: 1; }
  .popdemo .c-top { z-index: 3; }
  .popcore { position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 2; }
  .poppanel {
    position: absolute; display: flex; align-items: center; justify-content: center;
    container-type: size; opacity: 0; transition: opacity 0.25s;
  }
  .popdemo.is-on .poppanel { opacity: 1; transition-delay: 0.45s; }
  .popamount {
    font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 62cqh; line-height: 1; white-space: nowrap;
    background: linear-gradient(180deg, #fff6c8 0%, #ffd34d 45%, #e79a12 60%, #ffe27a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #3a1d00) drop-shadow(0 0 8px rgba(255, 190, 60, 0.45));
  }

  /* экраны фич / бонуса */
  .scrbox { position: relative; overflow: hidden; border-radius: 12px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  .scrbox::before { content: ''; position: absolute; inset: 0; background: var(--bg-img) center / cover no-repeat; }
  .scrbox::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(5, 8, 30, 0.15) 0%, rgba(5, 8, 30, 0.55) 62%, rgba(2, 3, 12, 0.92) 100%);
  }
  .scrbox.desk { width: 100%; max-width: 900px; aspect-ratio: 1920 / 1040; --bg-img: url(img/volt-coins-v3/v3/bg_desk.jpg); }
  .scrbox.mob { width: 300px; aspect-ratio: 800 / 1450; --bg-img: url(img/volt-coins-v3/v3/bg_mob.jpg); }
  .scrbox .anchor { position: absolute; inset: 0; }

  @media (max-width: 900px) {
    :root { --cell-w: 150px; }
    .row { grid-template-columns: 1fr; gap: 10px; }
    main { padding: 0 16px 60px; }
  }
</style>
</head>
<body>
  <header>
    <a class="back" href="volt-coins-v3.html">← К игре</a>
    <h1>Volt Coins V3 — все анимации игры</h1>
    <nav id="nav"></nav>
    <div class="tools">
      <button type="button" id="slowBtn" aria-pressed="false">Замедлить ×0.5</button>
      <button type="button" id="replayBtn">Повторить все</button>
    </div>
  </header>
  <main id="root"></main>
  <canvas id="lab"></canvas>

  <script src="vendor/spine-webgl.js"></script>
  <script src="js/spine-engine.js?v=10"></script>
  <script>
  (async () => {
    const IMG = 'img/volt-coins-v3';
    const FX = `${IMG}/fx`;
    const V = Date.now();
    const PMA = { premultipliedAlpha: true, version: V };
    const root = document.getElementById('root');
    const nav = document.getElementById('nav');
    const stage = new SpineEngine.SpineStage(document.getElementById('lab'));
    const BOX = {
      cell: { x: -160, y: -127, width: 320, height: 254 },
      frame: { x: -435, y: -347, width: 870, height: 694 },
      logo: { x: -620, y: -186, width: 1240, height: 372 },
      cellbolt: { x: -165, y: -150, width: 330, height: 300 },
      arc: { x: -500, y: -70, width: 1000, height: 140 },
      desk: { x: -960, y: -520, width: 1920, height: 1040 },
      mob: { x: -400, y: -725, width: 800, height: 1450 },
      rain: { x: -500, y: -260, width: 1000, height: 520 },
    };
    let speed = 1;
    const players = [];      // {run} — всё, что перезапускается кнопкой «Повторить все»
    const fmt = (s) => `${String(s).replace('.', ',')} с`;

    // ---------- разметка ----------
    let cat = null;
    const category = (id, title, note, text) => {
      cat = document.createElement('section');
      cat.className = 'cat';
      cat.id = id;
      cat.innerHTML = `<h2>${title}<span>${note}</span></h2>${text ? `<p>${text}</p>` : ''}`;
      root.appendChild(cat);
      nav.insertAdjacentHTML('beforeend', `<a href="#${id}">${title}</a>`);

        const LAP = [0, 250, 480, 730];

        const GL = await fetch(`${IMG}/glyphs/glyphs.json?v=${V}`).then((r) => r.json());
        const digits = '0123456789'.split('').map((c) => GL[c]);
        const CORE = digits.reduce((a, g) => a + (g.cb - g.ct) * g.h, 0) / digits.length;
        const GAP = 0.06;
        const em = (ch) => (ch.length === 1 ? GL[ch].h / CORE : 1 / (GL[ch].cb - GL[ch].ct));
        const glyphRow = (chars, px) => {
          const row = document.createElement('span');
          row.className = 'glyphs';
          row.style.fontSize = `${px}px`;
          for (const ch of chars) {
            const g = GL[ch]; const h = em(ch); const w = (g.w / g.h) * h;
            const img = document.createElement('img');
            img.src = `${IMG}/glyphs/${ch}.webp`;
            Object.assign(img.style, { height: `${h}em`, width: `${w}em`, marginBottom: `${-(1 - g.cb) * h}em`,
              marginLeft: `${-g.cl * w + GAP / 2}em`, marginRight: `${-(1 - g.cr) * w + GAP / 2}em` });
            row.appendChild(img);
          }
          return row;
        };
        const rowW = (chars) => chars.reduce((a, ch) => { const g = GL[ch]; const h = em(ch); return a + (g.cr - g.cl) * (g.w / g.h) * h + GAP; }, 0);
        const FACES = ['x1', 'x3', 'x5', 'x10', 'x15', 'x25', 'mini', 'minor', 'major'];

        const grid = box.querySelector('.cgrid');
        const cells = [...grid.querySelectorAll('.cc')];
        const run = async () => {
          clearTimeout(grid.t);
          grid.querySelectorAll('.ghost, .big').forEach((e) => e.remove());
          cells.forEach((c) => { c.style.visibility = ''; });
          const gr = grid.getBoundingClientRect();
          const cx = gr.width / 2; const cy = gr.height / 2;
          const order = cells.map((c) => {
            const r = c.getBoundingClientRect();
            return { c, x: r.left - gr.left, y: r.top - gr.top, w: r.width, h: r.height };
          }).sort((a, b) => Math.hypot(b.x + b.w / 2 - cx, b.y + b.h / 2 - cy) - Math.hypot(a.x + a.w / 2 - cx, a.y + a.h / 2 - cy));
          const FLY = 560 / speed; const STEP = 75 / speed;

            g.innerHTML = o.c.innerHTML;
            grid.appendChild(g);
            o.c.style.visibility = 'hidden';
            const dx = cx - (o.x + o.w / 2); const dy = cy - (o.y + o.h / 2);
            g.animate([
              { transform: 'translate(0,0) scale(1)', opacity: 1 },
              { transform: `translate(${-dx * 0.08}px,${-dy * 0.08}px) scale(1.12)`, opacity: 1, offset: 0.22 },
              { transform: `translate(${dx}px,${dy}px) scale(0.5)`, opacity: 1, offset: 0.9 },
              { transform: `translate(${dx}px,${dy}px) scale(0.35)`, opacity: 0 },
            ], { duration: FLY, delay: i * STEP, easing: 'cubic-bezier(0.55, 0, 0.8, 0.3)', fill: 'forwards' });
          });
          await new Promise((r) => setTimeout(r, FLY * 0.9 + (order.length - 1) * STEP));
          const bw = order[0].w * 1.75; const bh = bw * 381 / 480;
          const big = document.createElement('div');
          big.className = 'big';
          Object.assign(big.style, { left: `${cx - bw / 2}px`, top: `${cy - bh / 2}px`, width: `${bw}px`, height: `${bh}px` });

            + `<img class="coin" src="${IMG}/symbols/coin_value.png" alt=""><span class="burst"></span><span class="lbl"></span>`;
          grid.appendChild(big);
          const lbl = big.querySelector('.lbl');
          const set = (v) => { const ch = [...`x${v}`]; lbl.textContent = ''; lbl.appendChild(glyphRow(ch, Math.min(bh * 0.28, (bw * 0.42) / rowW(ch)))); };
          set(0);
          big.classList.add('is-in');
          // катушек на странице нет — бьют две молнии сверху-слева и сверху-справа, плюс венец
          const P = () => { const r = grid.getBoundingClientRect(); return { x: r.left + cx, y: r.top + cy }; };
          const tl = () => { const r = grid.getBoundingClientRect(); return { x: r.left - 40, y: r.top - 30 }; };
          const tr = () => { const r = grid.getBoundingClientRect(); return { x: r.right + 40, y: r.top - 30 }; };

              () => { const p = P(); return { x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d }; }, 'zap', 0.7, BONUS_TINT), (HIT + i * 25) / speed);
          }
          const t0 = performance.now();
          const COUNT = 700 / speed;
          await new Promise((res) => {
            const step = () => { const k = Math.min(1, (performance.now() - t0) / COUNT); set(Math.round(total * (1 - (1 - k) ** 3))); if (k < 1) requestAnimationFrame(step); else res(); };

        players.push({ run });

    });
    window.__lab = { stage, players };
  })();
  </script>
