<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Great Uniqorn — все анимации игры</title>
<!-- Все анимации слота great-uniqorn.html одним столбцом по категориям:
     подпись слева (что, клип, длительность, когда в игре), справа — сама
     анимация. Spine — те же скелеты, что грузит игра (spine/scatter,
     popups/*_desk|mob, screens/*_desk|mob); CSS-эффекты (дыхание, выигрыш
     символа, WILD -> множитель, линия) повторены по правилам из
     css/great-uniqorn.css. Spine рисуется на одном фиксированном канвасе
     поверх страницы, каждый инстанс привязан к своему боксу (anchorEl).
     Клик по анимации — повтор. -->
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root {
    --bg: #070f30;
    --panel: #0e1a4a;
    --line: rgba(255, 213, 106, 0.16);
    --text: #f4ecd6;
    --muted: #a3a9c9;
    --accent: #ffd56a;
    --red: #e2333b;
    --cell: 150px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Baloo 2', system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
    padding: 12px 24px; background: rgba(7, 15, 48, 0.95);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  a.back { color: var(--text); text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(226, 51, 59, 0.8); }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav a { color: var(--muted); text-decoration: none; font-size: 14px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); }
  nav a:hover { color: var(--accent); border-color: var(--accent); }
  .tools { margin-left: auto; display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 14px; color: var(--text); cursor: pointer;
    padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255, 213, 106, 0.4); background: var(--panel);
  }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  main { padding: 0 24px 80px; max-width: 1400px; }

  .cat { padding-top: 26px; scroll-margin-top: 70px; }
  .cat > h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .cat > h2 span { font-size: 14px; font-weight: 500; color: var(--muted); }
  .cat > p { margin: 0 0 14px; color: var(--muted); font-size: 14px; max-width: 820px; line-height: 1.4; }
  .row {
    display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start;
    padding: 18px 0; border-top: 1px solid var(--line);
  }
  .cap h3 { margin: 0 0 6px; font-size: 18px; }
  .cap .clip { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent); margin-bottom: 6px; }
  .cap p { margin: 0 0 8px; font-size: 14px; color: var(--muted); line-height: 1.4; }
  .kind { display: inline-block; font-size: 11px; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .stages { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
  .st { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .lbl { font-size: 12px; color: var(--muted); }

  /* ячейка барабана */
  .cell {
    position: relative; width: var(--cell); height: calc(var(--cell) * 211 / 202);
    background: radial-gradient(circle at 50% 45%, #1d2f86, #0d1850 75%);
    border: 1px solid rgba(255, 213, 106, 0.3); border-radius: 12px; cursor: pointer;
  }
  .cell img { position: absolute; inset: 4%; width: 92%; height: 92%; object-fit: contain; }
  .cell .spine { position: absolute; inset: 0; }

  /* --- CSS-анимации, как в css/great-uniqorn.css --- */
  @keyframes symbol-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  .cell.is-special img { animation: symbol-breathe 2.6s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(255, 213, 106, 0.45)); }
  @keyframes symbol-win {
    0%   { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(255, 213, 106, 0)); }
    35%  { transform: scale(1.16); filter: drop-shadow(0 0 22px rgba(255, 213, 106, 0.95)) brightness(1.18); }
    70%  { transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(255, 213, 106, 0.7)) brightness(1.08); }
    100% { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(255, 213, 106, 0)); }
  }
  .cell.is-winning img { animation: symbol-win 620ms ease-in-out both; }
  .cell.is-dim img { filter: brightness(0.45) saturate(0.6); transition: filter 200ms; }
  @keyframes wild-squeeze { 0% { transform: scale(1) rotate(0deg); filter: brightness(1); } 100% { transform: scale(0.2) rotate(-14deg); filter: brightness(2.4); } }
  @keyframes wild-pop {
    0%   { transform: scale(0.2) rotate(10deg); filter: brightness(2.4) drop-shadow(0 0 30px #fff2b8); }
    60%  { transform: scale(1.22) rotate(-3deg); filter: brightness(1.3) drop-shadow(0 0 26px rgba(255, 213, 106, 0.95)); }
    100% { transform: scale(1) rotate(0deg); filter: brightness(1) drop-shadow(0 0 12px rgba(255, 213, 106, 0.6)); }
  }
  @keyframes wild-burst { 0% { opacity: 0.95; transform: translate(-50%, -50%) scale(0.2); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }
  .cell.is-wild-squeeze img { animation: wild-squeeze 220ms ease-in forwards; }
  .cell.is-wild-pop img { animation: wild-pop 460ms cubic-bezier(0.3, 1.5, 0.5, 1) both; }
  .cell.is-wild-pop::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 115%; height: 110%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 246, 210, 0.95) 0%, rgba(255, 213, 106, 0.6) 35%, rgba(255, 213, 106, 0) 70%);
    animation: wild-burst 520ms ease-out forwards; pointer-events: none; z-index: 4;
  }
  .cell.is-multiplier img { filter: drop-shadow(0 0 14px rgba(255, 213, 106, 0.8)); }

  /* сетка 5x3 с линией */
  .grid {
    position: relative; display: grid; grid-template-columns: repeat(5, 96px); grid-template-rows: repeat(3, 100px);
    gap: 4px; padding: 8px; background: #0b1546; border: 3px solid #c9973a; border-radius: 14px; cursor: pointer;
  }
  .grid .cell { width: 96px; height: 100px; border-radius: 8px; }
  .win-line { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); overflow: visible; pointer-events: none; z-index: 5; }
  .win-line path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .win-line__glow { stroke: rgba(255, 196, 64, 0.65); stroke-width: 14; filter: blur(5px); }
  .win-line__core { stroke: #fff4cf; stroke-width: 4; }
  @keyframes win-line-draw { 0% { stroke-dashoffset: 1; opacity: 0.2; } 45% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
  .win-line.is-playing path { stroke-dasharray: 1; animation: win-line-draw 620ms ease-out; }
  .win-line:not(.is-playing) { opacity: 0; }

  /* экранные боксы: фон игры под скелетом */
  .scr { position: relative; overflow: hidden; margin: 30px 0; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; background: #000 center / cover no-repeat; }
  .st.wide { flex: 1 1 480px; max-width: 720px; align-items: stretch; }
  .scr.desk { width: 100%; aspect-ratio: 1932 / 940; }
  .scr.mob { width: 260px; aspect-ratio: 780 / 1416; }
  .scr .dim { position: absolute; inset: 0; background: rgba(4, 8, 30, 0.6); }
  .scr .spine { position: absolute; inset: 0; }
  .amount {
    position: absolute; display: flex; align-items: center; justify-content: center; gap: 0.28em;
    font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; font-weight: 800; color: #fff; white-space: nowrap;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), 0 0 18px rgba(0, 0, 0, 0.35);
    opacity: 0; transform: scale(0.6); z-index: 3;
  }
  .amount.is-in { opacity: 1; transform: none; transition: opacity 220ms ease, transform 320ms cubic-bezier(0.34, 1.6, 0.5, 1); }
  .amount .cur { font-size: 0.78em; }
  .count {
    position: fixed; z-index: 3; transform: translate(-50%, -50%); pointer-events: none;
    font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; font-weight: 900; line-height: 1; color: #fff;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.4), 0 0 18px rgba(0, 0, 0, 0.45);
  }

  #lab { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  @media (max-width: 900px) {
    :root { --cell: 120px; }
    header { position: static; padding: 10px 16px; }
    nav a { font-size: 13px; padding: 3px 10px; }
    .tools { margin-left: 0; }
    .row { grid-template-columns: 1fr; gap: 10px; }
    main { padding: 0 16px 60px; }
    .grid { grid-template-columns: repeat(5, 58px); grid-template-rows: repeat(3, 60px); gap: 3px; padding: 6px; }
    .grid .cell { width: 58px; height: 60px; }
    .win-line { inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
    .scr.mob { width: 46%; min-width: 150px; }
  }
</style>
</head>
<body>
  <header>
    <a class="back" href="great-uniqorn.html">← К игре</a>
    <h1>Great Uniqorn — все анимации</h1>
    <nav id="nav"></nav>
    <div class="tools">
      <button type="button" id="slowBtn" aria-pressed="false">Замедлить ×0.5</button>
      <button type="button" id="replayBtn">Повторить все</button>
    </div>
  </header>
  <main id="root"></main>
  <canvas id="lab"></canvas>

  <script src="vendor/spine-webgl.js"></script>
  <script src="js/spine-engine.js"></script>
  <script>
  (async () => {
    const IMG = 'img/great-uniqorn';
    const V = Date.now();
    const root = document.getElementById('root');
    const nav = document.getElementById('nav');
    const canvas = document.getElementById('lab');
    const stage = new SpineEngine.SpineStage(canvas);
    let speed = 1;
    const players = []; // { run } — перезапуск кнопкой «Повторить все»
    const wait = (ms) => new Promise((r) => setTimeout(r, ms / speed));
    const sym = (code) => `${IMG}/symbols/${code}.png?v=3`;

    // ---------- разметка ----------
    let cat = null;
    const category = (id, title, note, text) => {
      cat = document.createElement('section');
      cat.className = 'cat';
      cat.id = id;
      cat.innerHTML = `<h2>${title}<span>${note}</span></h2>${text ? `<p>${text}</p>` : ''}`;
      root.appendChild(cat);
      nav.insertAdjacentHTML('beforeend', `<a href="#${id}">${title}</a>`);
    };
    const row = ({ title, clip, text, kind }) => {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<div class="cap"><h3>${title}</h3>${clip ? `<div class="clip">${clip}</div>` : ''}
        ${text ? `<p>${text}</p>` : ''}<span class="kind">${kind}</span></div><div class="stages"></div>`;
      cat.appendChild(r);
      return r.querySelector('.stages');
    };
    const st = (stages, html, lbl) => {
      const d = document.createElement('div');
      d.className = html.includes('scr desk') ? 'st wide' : 'st';
      d.innerHTML = html + (lbl ? `<div class="lbl">${lbl}</div>` : '');
      stages.appendChild(d);
      return d.firstElementChild;
    };
    // повторяющийся проигрыватель: fn() играет один цикл, every — период, мс
    const loop = (el, fn, every) => {
      let t = null;
      const run = () => { clearTimeout(t); fn(); if (every) t = setTimeout(run, every / speed); };
      el.addEventListener('click', run);
      players.push({ run });
      run();
    };

    // ---------- Spine ----------
    const resCache = {};
    const loadRes = (folder) => {
      if (!resCache[folder]) resCache[folder] = SpineEngine.SpineResource.load(stage.assetManager, folder, { version: V });
      return resCache[folder];
    };
    // seq: [[clip, loop], ...]; every — повтор, мс (0 = один раз); onRun — колбэк на старте цикла
    const spine = async (anchor, folder, seq, { fit = 1, box = null, every = 0, onRun = null, clickEl = anchor } = {}) => {
      const res = await loadRes(folder);
      const inst = res.createInstance();
      inst.anchorEl = anchor;
      inst.fit = fit;
      if (box) inst.boundsOverride = box; // кадр макета, как в игре (не габарит сетап-позы)
      stage.addBase(inst);
      const play = () => {
        inst.animationState.timeScale = speed;
        inst.play(seq[0][0], seq[0][1]);
        for (const [c, l] of seq.slice(1)) inst.queue(c, l, 0);
        if (onRun) onRun(inst);
      };
      loop(clickEl, play, every);
      return inst;
    };
    const FRAME = { mob: { x: -390, y: -708, width: 780, height: 1416 }, desk: { x: -966, y: -470, width: 1932, height: 940 } };
    const fmt = (s) => `${String(+s.toFixed(2)).replace('.', ',')} с`;

    // =====================================================================
    category('scatter', 'Скаттер', 'бургер · Spine',
      'Скелет spine/scatter (scripts/great_uniqorn_scatter_spine.py): бургер по слоям. На сетке поверх ячейки, границы скелета ×2 от тайла — место под взрыв выигрыша.');
    for (const [title, seq, every, text] of [
      ['Idle', [['idle', true]], 0, 'Стоит на сетке: булка покачивается, сыр и котлета дышат. Петля.'],
      ['Land → Idle', [['land', false], ['idle', true]], 2200, 'Бургер приземлился на останавливающийся барабан (1-й / 2-й / 3-й — свой звук).'],
      ['Win → Idle', [['win', false], ['idle', true]], 3600, 'Выигрыш скаттеров: слои разлетаются вверх и собираются обратно, вспышка. Игра ждёт клип целиком перед попапом.'],
    ]) {
      const clipText = seq.map(([c]) => c).join(' → ');
      const s = row({ title, clip: `${clipText} · ${{ 'idle': '2 с', 'land': '0,6 с', 'win': '2,6 с' }[seq[0][0]]}`, text, kind: 'SPINE' });
      const cell = st(s, '<div class="cell"><div class="spine"></div></div>');
      spine(cell.querySelector('.spine'), `${IMG}/spine/scatter`, seq, { fit: 2, every, clickEl: cell });
    }

    // =====================================================================
    category('symbols', 'Символы', 'CSS',
      'Обычные символы — PNG без спайна: WILD и скаттер (если без Spine) всё время «дышат», остальные стоят, пока не выиграют.');
    {
      const s = row({ title: 'Дыхание', clip: 'symbol-breathe · 2,6 с · петля', text: 'WILD и множители на сетке, скаттер-фолбэк без WebGL.', kind: 'CSS' });
      for (const c of ['wild', 'x5', 'scatter']) st(s, `<div class="cell is-special"><img src="${sym(c)}" alt=""></div>`, c);
    }
    {
      const s = row({ title: 'Выигрыш символа', clip: 'symbol-win · 620 мс', text: 'Каждый символ выигравшей линии подпрыгивает с золотым свечением; не выигравшие притушены.', kind: 'CSS' });
      for (const c of ['k', 'docs', 'jet', 'hair']) {
        const cell = st(s, `<div class="cell"><img src="${sym(c)}" alt=""></div>`, c);
        loop(cell, () => { cell.classList.remove('is-winning'); void cell.offsetWidth; cell.classList.add('is-winning'); }, 1400);
      }
    }

    // =====================================================================
    category('wild', 'WILD → множитель', 'CSS · slot.js revealWildMultiplier',
      'Упавший WILD сжимается во вспышку (220 мс), подменяет картинку на xN и выпрыгивает обратно с золотым кольцом (460 мс). Звук — WILD_Multiplier.');
    {
      const s = row({ title: 'Превращение', clip: 'wild-squeeze 220 мс → wild-pop 460 мс + wild-burst 520 мс', text: 'Каждый круг — следующий множитель: x2, x3, x5, x7, x9.', kind: 'CSS' });
      for (const [i, m] of [2, 3, 5, 7, 9].entries()) {
        const cell = st(s, `<div class="cell"><img src="${sym('wild')}" alt=""></div>`, `x${m}`);
        const img = cell.querySelector('img');
        loop(cell, async () => {
          cell.className = 'cell';
          img.src = sym('wild');
          await wait(500 + i * 120);
          cell.classList.add('is-wild-squeeze');
          await wait(220);
          img.src = sym(`x${m}`);
          cell.classList.remove('is-wild-squeeze');
          void cell.offsetWidth;
          cell.classList.add('is-multiplier', 'is-wild-pop');
        }, 2600);
      }
    }

    // =====================================================================
    category('lines', 'Линия выигрыша', 'CSS · SVG',
      'Линия рисуется от первого барабана к последнему (620 мс) поверх сетки, символы линии подпрыгивают, остальные притушены.');
    {
      const s = row({ title: 'Линия + выигрыш символов', clip: 'win-line-draw · 620 мс', text: 'Пример: три линии подряд, как в цикле показа выигрышей.', kind: 'CSS' });
      const layout = [['k', 'jet', 'q', 'docs', 'a'], ['hair', 'hair', 'hair', 'j', 'k'], ['a', 'docs', 'k', 'jet', 'q']];
      const lines = [[1, 1, 1, 1, 1], [0, 1, 2, 1, 0], [2, 1, 0, 1, 2]];
      const wins = [3, 3, 2];
      const grid = st(s, `<div class="grid">${layout.flat().map((c) => `<div class="cell"><img src="${sym(c)}" alt=""></div>`).join('')}
        <svg class="win-line" viewBox="0 0 500 300" preserveAspectRatio="none"><path class="win-line__glow" pathLength="1"/><path class="win-line__core" pathLength="1"/></svg></div>`);
      const cells = [...grid.querySelectorAll('.cell')];
      const svg = grid.querySelector('svg');
      layout[1][3] = 'x3';
      cells[8].querySelector('img').src = sym('x3');
      cells[8].classList.add('is-multiplier');
      let k = 0;
      loop(grid, () => {
        const li = k++ % lines.length;
        const rows = lines[li];
        const d = rows.map((r, c) => `${c ? 'L' : 'M'}${c * 100 + 50} ${r * 100 + 50}`).join(' ');
        svg.querySelectorAll('path').forEach((p) => p.setAttribute('d', d));
        svg.classList.remove('is-playing'); void svg.getBoundingClientRect(); svg.classList.add('is-playing');
        cells.forEach((cell, i) => {
          const r = Math.floor(i / 5), c = i % 5;
          const on = rows[c] === r && c < wins[li] + (li === 0 ? 1 : 0);
          cell.classList.toggle('is-dim', !on);
          cell.classList.remove('is-winning');
          if (on) { void cell.offsetWidth; cell.classList.add('is-winning'); }
        });
      }, 1500);
    }

    // =====================================================================
    // Коробки суммы в кадре попапа 780x1416 — как .game-popup__amount в css.
    const AMOUNT_BOX = {
      win:   { l: 121, t: 734, w: 539, h: 75, fs: 56, text: '1 250 000', cur: 'FUN', delay: 720 },
      total: { l: 120, t: 831, w: 541, h: 86, fs: 72, text: '842 500', cur: 'FUN', delay: 720 },
      spins: { l: 329, t: 688.5, w: 120, h: 120, fs: 96, text: '10', cur: '', delay: 900 },
    };
    category('popups', 'Попапы', 'Spine · intro 1,2 с → idle 6 с (петля)',
      'Скелеты popups/&lt;попап&gt;_desk|mob (scripts/great_uniqorn_popups.py): лучи, плашка, надпись, герой из-за надписи, летящие купюры / ленты / монеты. Сумма — DOM-текст поверх плашки, проявляется, когда плашка уже выпрыгнула. На десктопе попап — по центру сцены (×0,74), на телефоне — во всю ширину.');
    for (const [key, title, kind, text] of [
      ['big', 'BIG WIN', 'win', 'Выигрыш от 10× ставки (звук WIN_Bigwin).'],
      ['mega', 'MEGA WIN', 'win', 'Выигрыш от 25× ставки (WIN_Megawin).'],
      ['epic', 'EPIC WIN', 'win', 'Выигрыш от 50× ставки (WIN_Epicwin).'],
      ['fswin', 'FREESPINS WIN', 'spins', 'Число фриспинов в круглом значке. В игре на входе в бонус вместо него идёт бонус-экран, попап — запасной вариант.'],
      ['bstotal', 'BONUS SPINS TOTAL WIN', 'total', 'Итог раунда фриспинов — и выигранного скаттерами, и купленного. Сумма набегает счётчиком.'],
    ]) {
      const s = row({ title, clip: `popups/${key}_desk · ${key}_mob`, text, kind: 'SPINE + DOM' });
      for (const v of ['desk', 'mob']) {
        const bg = `${IMG}/img/bg_${v}_${key === 'bstotal' || key === 'fswin' ? 'bonus' : 'base'}.jpg`;
        // кадр попапа 780x1416; на десктопе он внутри сцены, поэтому сцена-коробка + кадр по центру
        const box = st(s, `<div class="scr ${v}" style="background-image:url(${bg})"><div class="dim"></div>
          <div class="frame" style="position:absolute;${v === 'desk' ? 'left:35.07%;top:9.5%;width:29.86%;height:111.4%' : 'left:9%;top:9%;width:82%;height:82%'}">
          <div class="spine" style="position:absolute;inset:0"></div><div class="amount"></div></div></div>`, v === 'desk' ? 'десктоп' : 'телефон');
        const frame = box.querySelector('.frame');
        const am = box.querySelector('.amount');
        const a = AMOUNT_BOX[kind];
        Object.assign(am.style, { left: `${a.l / 7.8}%`, top: `${a.t / 14.16}%`, width: `${a.w / 7.8}%`, height: `${a.h / 14.16}%` });
        am.innerHTML = `<span>${a.text}</span>${a.cur ? `<span class="cur">${a.cur}</span>` : ''}`;
        const fitFont = () => { am.style.fontSize = `${a.fs * frame.clientWidth / 780}px`; };
        new ResizeObserver(fitFont).observe(frame);
        let t = null;
        spine(frame.querySelector('.spine'), `${IMG}/popups/${key}_${v}`, [['intro', false], ['idle', true]], {
          box: FRAME.mob, every: 7500, clickEl: box,
          onRun: () => { am.classList.remove('is-in'); clearTimeout(t); t = setTimeout(() => am.classList.add('is-in'), a.delay / speed); },
        });
      }
    }

    // =====================================================================
    category('screens', 'Экраны фич и бонуса', 'Spine · intro 3 с → idle 4 с (петля)',
      'Скелеты screens/feature|bonus_desk|mob (scripts/great_uniqorn_screens.py). Фон — картинка игры в DOM под скелетом. Превью фич показывается при входе в игру, бонус-экран — на входе во фриспины вместо попапа FREESPINS WIN.');
    for (const [kind, title, text] of [
      ['feature', 'Превью фич', 'Логотип, герой, панели WILD MULTIPLIER (x2–x9) и FREE SPINS (3/4/5 бургеров = 10/15/20 спинов), TAP TO CONTINUE.'],
      ['bonus', 'Бонус-экран', 'Герой, значок раунда (число спинов набегает DOM-текстом на кости count), FREESPINS WIN и подписи. В игре закрывается сам или по тапу.'],
    ]) {
      const s = row({ title, clip: `screens/${kind}_desk · ${kind}_mob`, text, kind: kind === 'bonus' ? 'SPINE + DOM' : 'SPINE' });
      for (const v of ['desk', 'mob']) {
        const bg = `${IMG}/img/bg_${v}_${kind === 'bonus' ? 'bonus' : 'base'}.jpg`;
        const box = st(s, `<div class="scr ${v}" style="background-image:url(${bg})"><div class="dim" style="background:rgba(4,8,30,.45)"></div><div class="spine"></div></div>`, v === 'desk' ? 'десктоп' : 'телефон');
        let count = null, started = 0;
        if (kind === 'bonus') {
          count = document.createElement('div');
          count.className = 'count';
          count.style.opacity = '0';
          document.body.appendChild(count);
        }
        const inst = await spine(box.querySelector('.spine'), `${IMG}/screens/${kind}_${v}`, [['intro', false], ['idle', true]], { box: FRAME[v], every: 9000, clickEl: box });
        if (count) {
          const UNITS = { desk: 150, mob: 130 }[v];
          const tick = () => {
            const bone = inst.skeleton.findBone('count');
            const r = box.getBoundingClientRect();
            const vis = r.bottom > 0 && r.top < innerHeight;
            if (bone && vis) {
              const dpr = window.devicePixelRatio || 1;
              const cr = canvas.getBoundingClientRect();
              count.style.left = `${cr.left + (bone.worldX + canvas.width / 2) / dpr}px`;
              count.style.top = `${cr.top + (canvas.height / 2 - bone.worldY) / dpr}px`;
              count.style.fontSize = `${(UNITS * Math.hypot(bone.b, bone.d)) / dpr}px`;
              const e = inst.animationState.getCurrent(0);
              const tt = e && e.animation && e.animation.name === 'intro' ? e.trackTime : Infinity;
              const k = Math.max(0, Math.min(1, (tt - 1.4) / 0.6));
              count.textContent = String(Math.round(10 * k));
              count.style.opacity = tt < 1.4 ? '0' : '1';
            } else count.style.opacity = '0';
            requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      }
    }

    // ---------- кнопки ----------
    document.getElementById('replayBtn').addEventListener('click', () => players.forEach((p) => p.run()));
    const slowBtn = document.getElementById('slowBtn');
    slowBtn.addEventListener('click', () => {
      speed = speed === 1 ? 0.5 : 1;
      slowBtn.setAttribute('aria-pressed', String(speed !== 1));
      document.documentElement.style.setProperty('--speed', speed);
      document.getAnimations().forEach((a) => { a.playbackRate = speed; });
      players.forEach((p) => p.run());
    });
    window.gu = { stage, players };
  })();
  </script>
</body>
</html>
