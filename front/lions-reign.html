<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lion's Reign — Savannah Kings variant</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/preloader.css?v=1">
<link rel="stylesheet" href="css/lions-reign.css?v=1">
</head>
<body>

  <div class="preloader" id="preloader">
    <div class="preloader__logo" id="preloaderLogo"><img src="img/lions-reign/img/logo.webp" alt="" onerror="this.remove()"></div>
    <div class="preloader__bar"><div class="preloader__fill" id="preloaderFill"></div></div>
    <div class="preloader__pct" id="preloaderPct">0%</div>
  </div>

  <div class="screen" id="screen" data-mode="base">
    <!-- Day and night backgrounds both live in the DOM and cross-fade
         (GDD §3.2: the switch to night is the free-spins signal). -->
    <img class="bg bg--base" id="bgBase" alt="">
    <img class="bg bg--bonus" id="bgBonus" alt="">
    <canvas class="fx fx--back" id="fxBack"></canvas>

    <!-- Everything else sits on one design-size stage, scaled to fit. -->
    <div class="stage" id="stage">

      <!-- V3 "Royal Court": strictly symmetric. Jackpot crown above the
           frame crest, Buy and Win/Free-spins medallions mirrored either
           side of the reels, a floating pill with the spin breaking out. -->
      <img class="logo" src="img/lions-reign/img/logo.webp" alt="Lion's Reign">

      <div class="sys">
        <button class="ibtn ibtn--ghost" id="soundBtn" type="button" aria-label="Sound"><svg viewBox="0 0 24 24"><path class="snd" d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z"/><path class="wav" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M15 9l6 6M21 9l-6 6"/></svg></button>
        <button class="ibtn ibtn--ghost" id="infoBtn" type="button" aria-label="Paytable"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg></button>
        <div class="menu" id="menu">
          <button class="ibtn ibtn--ghost" id="menuBtn" type="button" aria-label="Menu">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="menu__fly">
            <a class="menu__item" href="games.html"><svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h4.5v-5h3v5H18V9.5"/></svg><span>LOBBY</span></a>
          </div>
        </div>
      </div>

      <!-- Prize crown: GRAND is the keystone over the crest, the three lower
           tiers form the step beneath it (MINOR · MAJOR · MINI). -->
      <!-- The frame's crowned crest rises into the top band, so the prize
           ladder runs in one row above it, MINI -> GRAND. -->
      <div class="crown crown--ladder">
        <div class="jp jp--mini"><img src="img/lions-reign/img/jp_mini.webp" alt="Mini"><span data-jp-value="mini"></span></div>
        <div class="jp jp--minor"><img src="img/lions-reign/img/jp_minor.webp" alt="Minor"><span data-jp-value="minor"></span></div>
        <div class="jp jp--major"><img src="img/lions-reign/img/jp_major.webp" alt="Major"><span data-jp-value="major"></span></div>
        <div class="crown__top"><div class="jp jp--grand"><img src="img/lions-reign/img/jp_grand.webp" alt="Grand"><span data-jp-value="grand"></span></div></div>
      </div>

      <div class="reel" id="reel">
        <div class="reel__bg"></div>
        <div class="reel__grid" id="reelGrid"></div>
        <img class="reel__frame" src="img/lions-reign/img/reel_frame.webp" alt="">
        <div class="reel-win-plate" id="reelWinPlate"></div>
        <div class="reel-win" id="reelWinAmount"></div>
      </div>

      <!-- Left medallion: Buy Bonus. -->
      <button class="medal medal--buy buy-btn" type="button" data-buy-open aria-label="Buy bonus">
        <span class="medal__disc">
          <span class="medal__core"></span>
          <img class="medal__hub" src="img/lions-reign/img/wheel_hub.webp" alt="">
          <img class="medal__rim" src="img/lions-reign/img/wheel_rim.webp" alt="">
        </span>
        <span class="medal__caption">BUY BONUS</span>
        <span class="medal__chip"><span id="buyPrice"></span></span>
      </button>

      <!-- Right medallion, its mirror: last win in the base game, spins left
           and bonus win during free spins. -->
      <div class="medal medal--status">
        <span class="medal__disc">
          <span class="medal__core"></span>
          <img class="medal__rim" src="img/lions-reign/img/wheel_rim.webp" alt="">
        </span>
        <div class="readout readout--win" id="winReadout">
          <span class="readout__value" id="winValue"></span>
          <span class="readout__label">WIN</span>
        </div>
        <div class="fs-panel" id="fsPanel">
          <div class="fs-panel__cell">
            <span class="fs-panel__value" id="fsLeft">10</span>
            <span class="fs-panel__label">FREE SPINS</span>
          </div>
          <div class="fs-panel__sep"></div>
          <div class="fs-panel__cell">
            <span class="fs-panel__label">BONUS WIN</span>
            <span class="fs-panel__value" id="fsWin">0.00</span>
          </div>
        </div>
      </div>

      <!-- Floating pill: balance | turbo SPIN auto | bet. -->
      <div class="bar" id="bar">
        <div class="bar__left">
          <div class="readout readout--balance" id="balanceReadout">
            <span class="readout__label">BALANCE</span>
            <span class="readout__value"><span id="balanceValue">0.00</span> <small id="currency">FUN</small></span>
          </div>
        </div>

        <div class="bar__center">
          <button class="ibtn" id="turboBtn" type="button" aria-label="Turbo"><svg viewBox="0 0 24 24"><path d="M13.5 3 6 13.5h5L10 21l8-10.5h-5L13.5 3Z" class="fill"/></svg></button>
          <button class="spin" id="spinBtn" type="button" aria-label="Spin">
            <span class="spin__ring"></span>
            <svg class="spin__icon" viewBox="0 0 48 48"><path d="M10 21a15 15 0 0 1 25-7.5"/><path d="M35.5 7v7h-7"/><path d="M38 27a15 15 0 0 1-25 7.5"/><path d="M12.5 41v-7h7"/></svg>
            <svg class="spin__stop" viewBox="0 0 48 48"><rect x="15" y="15" width="18" height="18" rx="3"/></svg>
            <span class="spin__count" id="spinCount"></span>
          </button>
          <div class="auto-wrap">
            <button class="ibtn" id="autoBtn" type="button" aria-label="Autoplay"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/><path d="M10 9l5 3-5 3Z" class="fill"/></svg></button>
            <div class="auto-menu" id="autoMenu" hidden>
              <span class="auto-menu__title">AUTOPLAY</span>
              <button data-auto="10" type="button">10</button>
              <button data-auto="25" type="button">25</button>
              <button data-auto="50" type="button">50</button>
              <button data-auto="100" type="button">100</button>
              <button data-auto="inf" type="button">∞</button>
            </div>
          </div>
        </div>

        <div class="bar__right">
          <div class="bet">
            <button class="ibtn ibtn--sm" id="betMinus" type="button" aria-label="Lower bet"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
            <div class="readout readout--bet">
              <span class="readout__label">BET</span>
              <span class="readout__value" id="betValue">0.00</span>
            </div>
            <button class="ibtn ibtn--sm" id="betPlus" type="button" aria-label="Raise bet"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <canvas class="fx fx--front" id="fxFront"></canvas>
    <div class="screen-dim" id="screenDim"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Popups, the wheel and the buy window are scaled with the stage too. -->
    <div class="overlays stage" id="overlays">

      <div class="wheel-overlay" id="wheelOverlay" hidden>
        <img class="wheel-overlay__title" src="img/lions-reign/img/title_jackpot.webp" alt="Jackpot">
        <div class="jackpots jackpots--wheel">
          <div class="jp jp--grand"><img src="img/lions-reign/img/jp_grand.webp" alt="Grand"><span data-jp-value="grand"></span></div>
          <div class="jp jp--major"><img src="img/lions-reign/img/jp_major.webp" alt="Major"><span data-jp-value="major"></span></div>
          <div class="jp jp--minor"><img src="img/lions-reign/img/jp_minor.webp" alt="Minor"><span data-jp-value="minor"></span></div>
          <div class="jp jp--mini"><img src="img/lions-reign/img/jp_mini.webp" alt="Mini"><span data-jp-value="mini"></span></div>
        </div>
        <div class="wheel">
          <div class="wheel__glow"></div>
          <div class="wheel__disc" id="wheelDisc"></div>
          <img class="wheel__rim" src="img/lions-reign/img/wheel_rim.webp" alt="">
          <div class="wheel__lights" id="wheelLights"></div>
          <img class="wheel__hub" src="img/lions-reign/img/wheel_hub.webp" alt="">
          <img class="wheel__pointer" id="wheelPointer" src="img/lions-reign/img/wheel_pointer.webp" alt="">
        </div>
        <button class="wheel__btn" id="wheelSpinBtn" type="button" disabled>SPIN THE WHEEL</button>
        <div class="wheel-award" id="wheelAward" hidden>
          <div class="wheel-award__rays"></div>
          <div class="wheel-award__tier"></div>
          <div class="wheel-award__panel"><img src="img/lions-reign/img/panel.webp" alt=""><div class="wheel-award__value"></div></div>
        </div>
      </div>

      <div class="buy-overlay" id="buyOverlay" hidden>
        <div class="buy">
          <img class="buy__title" src="img/lions-reign/img/title_buybonus.webp" alt="Buy Bonus">
          <button class="buy__close" type="button" data-buy="close" aria-label="Close">×</button>
          <div class="buy__cards"></div>
          <div class="buy__confirm">
            <p class="buy__q"></p>
            <div class="buy__actions">
              <button class="gbtn gbtn--no" type="button" data-buy="no">CANCEL</button>
              <button class="gbtn" type="button" data-buy="yes">BUY</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="paytable" id="paytable" hidden>
      <div class="paytable__panel">
        <button class="paytable__close" id="paytableClose" type="button" aria-label="Close">×</button>
        <h2>Paytable &amp; Rules</h2>
        <div class="paytable__body" id="paytableBody"></div>
      </div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/telegram.js?v=2"></script>
  <script src="js/preloader.js?v=1"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script>window.SK_ASSET_ROOT = 'img/lions-reign';</script>
  <script src="js/savannah-kings/sound.js?v=1"></script>
  <script src="js/reel-spin.js?v=2"></script>
  <script src="js/buy-bonus.js?v=1"></script>
  <script src="js/savannah-kings/fx.js?v=1"></script>
  <script src="js/savannah-kings/slot.js?v=4"></script>
  <script src="js/savannah-kings/app.js?v=3"></script>
</body>
</html>
