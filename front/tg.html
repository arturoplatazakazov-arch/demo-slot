<!doctype html>
<!-- Портфолио-каталог для Telegram Mini App: тот же лобби-грид, что games.html,
     но БЕЗ сервисных карточек (конструкторы, anim-lab; есть только вход в
     комнаты проектов в games.html) и без кнопок «Админка»
     на карточках (window.CATALOG_PORTFOLIO — см. games-catalog.js). Игры
     приходят из GET /catalog как обычно. -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог игр</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/games.css?v=11">
</head>
<body>

  <div class="lobby">
    <div class="lobby__header">
      <h1 class="lobby__title">Каталог игр</h1>
      <p class="lobby__subtitle">Выберите слот, чтобы начать демо-игру</p>
    </div>

    <ul class="game-grid">
      <li class="static-card">
        <a class="game-card secret-card" href="games.html?from=tg">
          <div class="game-card__media">
            <span class="game-card__badge">Private</span>
            <svg class="secret-card__lock" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="4.5" y="10" width="15" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor"/></svg>
          </div>
          <div class="game-card__body">
            <h2 class="game-card__name">Private Rooms</h2>
            <p class="game-card__desc">Illuminator, Uniqorn, Spin Factory, Secret Room — вход по паролю</p>
            <span class="game-card__play">
              <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4Z" fill="currentColor"/></svg>
              Открыть
            </span>
          </div>
        </a>
      </li>
    </ul>

    <section class="catalog-section" id="readySection">
      <h2 class="catalog-section__title">Готовые игры</h2>
      <ul class="game-grid" id="readyGrid"></ul>
    </section>
  </div>

  <script>
    window.CATALOG_PORTFOLIO = true;
    try { sessionStorage.setItem('catalogHome', 'tg.html'); } catch { /* storage off */ }
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/telegram.js?v=3"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script>
    // Ссылка на комнату из бота: t.me/<бот>/<app>?startapp=room_<пароль> →
    // сразу во вкладку этой комнаты в games.html. start_param живёт всю сессию
    // мини-аппа, поэтому переход делаем один раз (иначе «в каталог» снова
    // уводил бы в комнату).
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;
      const param = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      if (!param || !param.startsWith('room_')) return;
      try {
        if (sessionStorage.getItem('secretRoom.startHandled') === param) return;
        sessionStorage.setItem('secretRoom.startHandled', param);
      } catch { /* storage off */ }
      location.replace('games.html?from=tg#key=' + encodeURIComponent(param.slice(5)));
    })();
  </script>
  <script src="js/games-catalog.js?v=19"></script>
</body>
</html>
