<!doctype html>
<!-- Портфолио-каталог для Telegram Mini App: тот же лобби-грид, что games.html,
     но БЕЗ сервисных карточек (конструкторы, anim-lab; есть только вход в
     Secret Room) и без кнопок «Админка»
     на карточках (window.CATALOG_PORTFOLIO — см. games-catalog.js). Игры
     приходят из GET /catalog как обычно. -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог игр</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/games.css?v=4">
</head>
<body>

  <div class="lobby">
    <div class="lobby__header">
      <h1 class="lobby__title">Каталог игр</h1>
      <p class="lobby__subtitle">Выберите слот, чтобы начать демо-игру</p>
    </div>

    <ul class="game-grid">
      <li class="static-card">
        <a class="game-card secret-card" href="secret-room.html?from=tg">
          <div class="game-card__media">
            <span class="game-card__badge">Private</span>
            <svg class="secret-card__lock" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="4.5" y="10" width="15" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor"/></svg>
          </div>
          <div class="game-card__body">
            <h2 class="game-card__name">Secret Room</h2>
            <p class="game-card__desc">Игры в разработке — вход по паролю</p>
            <span class="game-card__play">
              <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4Z" fill="currentColor"/></svg>
              Войти
            </span>
          </div>
        </a>
      </li>
    </ul>

    <section class="catalog-section" id="readySection">
      <h2 class="catalog-section__title">Готовые игры</h2>
      <ul class="game-grid" id="readyGrid"></ul>
    </section>

    <section class="catalog-section" id="illuminatorSection">
      <h2 class="catalog-section__title">Illuminator</h2>
      <ul class="game-grid" id="illuminatorGrid"></ul>
    </section>

    <section class="catalog-section" id="spinFactorySection">
      <h2 class="catalog-section__title">В работе</h2>
      <ul class="game-grid" id="spinFactoryGrid"></ul>
    </section>
  </div>

  <script>window.CATALOG_PORTFOLIO = true;</script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/telegram.js?v=2"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script src="js/games-catalog.js?v=12"></script>
</body>
</html>
