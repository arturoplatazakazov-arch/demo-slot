<!doctype html>
<!-- Портфолио-каталог для Telegram Mini App: тот же лобби-грид, что games.html,
     но БЕЗ сервисных карточек (конструкторы, anim-lab) и без кнопок «Админка»
     на карточках (window.CATALOG_PORTFOLIO — см. games-catalog.js). Игры
     приходят из GET /catalog как обычно. -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог игр</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/games.css?v=2">
</head>
<body>

  <div class="lobby">
    <div class="lobby__header">
      <h1 class="lobby__title">Каталог игр</h1>
      <p class="lobby__subtitle">Выберите слот, чтобы начать демо-игру</p>
    </div>

    <ul class="game-grid" id="gameGrid"></ul>
  </div>

  <script>window.CATALOG_PORTFOLIO = true;</script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/telegram.js?v=2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js?v=2"></script>
  <script src="js/games-catalog.js?v=2"></script>
</body>
</html>
