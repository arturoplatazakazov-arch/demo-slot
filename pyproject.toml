[project]
name = "demo-slot"
version = "0.1.0"
description = "Backend slot-machine game engine (config-driven math, pluggable bonus features)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "numpy>=2.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The app's SQLAlchemy async engine (app/core/db.py) is a module-level
# singleton whose connection pool binds to whatever event loop first used
# it. pytest-asyncio's default per-test loop breaks that pool on the second
# test that touches the DB ("attached to a different loop") — sharing one
# loop for the whole run avoids it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
