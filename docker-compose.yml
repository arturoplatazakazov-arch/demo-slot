services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo_slot
      POSTGRES_PASSWORD: demo_slot
      POSTGRES_DB: demo_slot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_slot -d demo_slot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://demo_slot:demo_slot@postgres:5432/demo_slot
      DATABASE_URL_SYNC: postgresql+psycopg://demo_slot:demo_slot@postgres:5432/demo_slot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/srv/app/app
      - ./alembic:/srv/app/alembic

volumes:
  postgres_data:
