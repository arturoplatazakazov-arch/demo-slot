# Deploys front/ to GitHub Pages on every push to the `pages` branch.
# `main` stays the dev trunk; releasing the portfolio = merging into `pages`.
name: Deploy front to GitHub Pages

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      # Localisation review material (loc-*.html + img/*/loc/ screenshots) is
      # internal only — keep it off the public site even if a merge brings it back.
      - name: Drop localisation review pages
        run: rm -rf front/loc-*.html front/img/*/loc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: front
      - id: deployment
        uses: actions/deploy-pages@v5
